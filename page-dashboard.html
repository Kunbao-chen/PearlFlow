<!DOCTYPE html>
<!--
==========================================================================
PearlFlow - Dashboard 儀表板
@file        page-dashboard.html
@description 事務所營運狀況總覽，支援點擊專案直接跳轉至專案進度矩陣
==========================================================================
-->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard 儀表板</title>
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global-config.js"></script>
    <script src="js/icons.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { padding: 24px; font-family: system-ui, -apple-system, sans-serif; background: transparent; margin: 0; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        
        /* 頂部數據指標卡片 */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: rgba(255, 255, 255, 0.92); border: 1px solid var(--border-color); border-radius: 10px; padding: 18px 20px; backdrop-filter: blur(8px); box-shadow: var(--shadow-soft); }
        .stat-label { font-size: 0.88rem; color: #666; font-weight: 500; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: var(--primary-color); }
        
        /* 主內容兩欄版面 */
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

        .card { background: rgba(255, 255, 255, 0.92); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; backdrop-filter: blur(8px); box-shadow: var(--shadow-soft); margin-bottom: 20px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .card-title { font-size: 1.05rem; font-weight: 600; color: var(--primary-color); display: flex; align-items: center; gap: 8px; margin: 0; }

        /* 可點擊之專案進度卡片 */
        .project-item-card { border: 1px solid var(--border-color); border-radius: 8px; padding: 14px 16px; margin-bottom: 12px; background: #fff; cursor: pointer; transition: all 0.2s ease; }
        .project-item-card:hover { border-color: var(--primary-color); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(182, 40, 70, 0.1); }
        .project-item-card:last-child { margin-bottom: 0; }
        
        .project-info-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .project-title-text { font-weight: 600; font-size: 0.98rem; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
        .client-badge { font-size: 0.82rem; background: var(--primary-light); color: var(--primary-color); padding: 2px 8px; border-radius: 4px; font-weight: 500; }

        /* 進度條元件 */
        .progress-bar-bg { width: 100%; height: 8px; background: #E0E0E0; border-radius: 4px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { height: 100%; background: var(--primary-color); border-radius: 4px; transition: width 0.3s ease; }

        .btn-secondary { background: #fff; color: var(--text-primary); border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .btn-secondary:hover { border-color: var(--primary-color); color: var(--primary-color); }
    </style>
</head>
<body>

    <div class="header-bar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span data-pf-icon="dashboard" data-size="22" style="color: var(--primary-color);"></span>
            <h2 style="margin: 0; color: var(--primary-color); font-size: 1.25rem;">Dashboard 儀表板</h2>
        </div>
        <button class="btn-secondary" onclick="loadDashboardData()">
            <span data-pf-icon="refresh"></span> 重新整理
        </button>
    </div>

    <!-- 頂部數據指標 -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-label"><span data-pf-icon="users"></span> 合作客戶總數</div>
            <div class="stat-value" id="stat-client-count">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label"><span data-pf-icon="grid"></span> 進行中專案數</div>
            <div class="stat-value" id="stat-active-project-count">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label"><span data-pf-icon="check"></span> 已完成專案數</div>
            <div class="stat-value" id="stat-completed-project-count">-</div>
        </div>
        <div class="stat-card">
            <div class="stat-label"><span data-pf-icon="edit"></span> 預設 SOP 模板數</div>
            <div class="stat-value" id="stat-template-count">-</div>
        </div>
    </div>

    <!-- 內容版面 -->
    <div class="dashboard-grid">
        <!-- 左側：進行中專案與進度 -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title"><span data-pf-icon="grid"></span> 進行中專案進度追蹤</h3>
                <button class="btn-secondary" onclick="jumpToProjectMatrix()">開啟完整矩陣 ▶</button>
            </div>
            <div id="project-list-container">
                <div style="text-align: center; color: #888; padding: 20px;">資料載入中...</div>
            </div>
        </div>

        <!-- 右側：近期動態 / 即將到期步驟 -->
        <div class="card">
            <div class="card-header">
                <h3 class="card-title"><span data-pf-icon="calendar"></span> 即將到期步驟</h3>
            </div>
            <div id="upcoming-tasks-container">
                <div style="text-align: center; color: #888; padding: 20px;">資料載入中...</div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboardData();
        });

        async function loadDashboardData() {
            if (!window.supabase) return;

            // 1. 讀取統計指標
            const { count: clientCount } = await window.supabase.from('clients').select('*', { count: 'exact', head: true });
            const { count: templateCount } = await window.supabase.from('templates').select('*', { count: 'exact', head: true });
            
            document.getElementById('stat-client-count').innerText = clientCount || 0;
            document.getElementById('stat-template-count').innerText = templateCount || 0;

            // 2. 讀取專案列表及其步驟 (計算法定進度)
            const { data: projects, error } = await window.supabase
                .from('projects')
                .select('id, name, status, clients(name), project_tasks(id, is_completed, due_date, task_name)')
                .order('created_at', { ascending: false });

            if (error) {
                console.error('無法載入 Dashboard 資料:', error);
                return;
            }

            const activeProjects = (projects || []).filter(p => p.status !== 'completed');
            const completedProjects = (projects || []).filter(p => p.status === 'completed');

            document.getElementById('stat-active-project-count').innerText = activeProjects.length;
            document.getElementById('stat-completed-project-count').innerText = completedProjects.length;

            // 3. 渲染進行中專案卡片
            const projectListContainer = document.getElementById('project-list-container');
            if (activeProjects.length === 0) {
                projectListContainer.innerHTML = `<div style="text-align: center; color: #888; padding: 20px;">目前尚無進行中的專案</div>`;
            } else {
                projectListContainer.innerHTML = activeProjects.map(p => {
                    const tasks = p.project_tasks || [];
                    const totalTasks = tasks.length;
                    const completedTasks = tasks.filter(t => t.is_completed).length;
                    const percent = totalTasks > 0 ? Math.round((completedTasks / totalTasks) * 100) : 0;
                    const clientName = p.clients ? p.clients.name : '未指定客戶';

                    return `
                        <div class="project-item-card" onclick="jumpToProject('${p.id}')">
                            <div class="project-info-row">
                                <div class="project-title-text">
                                    <span>📌</span> ${p.name}
                                </div>
                                <span class="client-badge">${clientName}</span>
                            </div>
                            <div style="display: flex; justify-content: space-between; font-size: 0.82rem; color: #666; margin-top: 6px;">
                                <span>完成進度：${completedTasks} / ${totalTasks} 步驟</span>
                                <span style="font-weight: bold; color: var(--primary-color);">${percent}%</span>
                            </div>
                            <div class="progress-bar-bg">
                                <div class="progress-bar-fill" style="width: ${percent}%;"></div>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // 4. 渲染即將到期的步驟 (取未完成且前 5 個最接近到期日的任務)
            const upcomingContainer = document.getElementById('upcoming-tasks-container');
            let allUpcomingTasks = [];

            (projects || []).forEach(p => {
                (p.project_tasks || []).forEach(t => {
                    if (!t.is_completed && t.due_date) {
                        allUpcomingTasks.push({
                            taskId: t.id,
                            taskName: t.task_name,
                            dueDate: t.due_date,
                            projectId: p.id,
                            projectName: p.name
                        });
                    }
                });
            });

            // 依到期日排序
            allUpcomingTasks.sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
            const topUpcoming = allUpcomingTasks.slice(0, 5);

            if (topUpcoming.length === 0) {
                upcomingContainer.innerHTML = `<div style="text-align: center; color: #888; padding: 20px;">目前無即將到期的任務</div>`;
            } else {
                upcomingContainer.innerHTML = topUpcoming.map(t => `
                    <div class="project-item-card" style="padding: 10px 12px; margin-bottom: 8px;" onclick="jumpToProject('${t.projectId}')">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <span style="font-weight: 600; font-size: 0.88rem; color: var(--text-primary);">${t.taskName}</span>
                            <span style="font-size: 0.78rem; color: var(--primary-color); background: var(--primary-light); padding: 2px 6px; border-radius: 4px; font-weight: 600;">${t.dueDate}</span>
                        </div>
                        <div style="font-size: 0.8rem; color: #777; margin-top: 4px;">屬於專案：${t.projectName}</div>
                    </div>
                `).join('');
            }
        }

        // 跳轉至專案進度矩陣頁面，並打開該專案的詳情 Modal
        function jumpToProject(projectId) {
            if (!projectId) return;
            
            const targetUrl = `page-matrix.html?openProjectId=${projectId}`;
            if (window.parent && typeof window.parent.switchPage === 'function') {
                window.parent.switchPage(targetUrl);
            } else {
                window.location.href = targetUrl;
            }
        }

        function jumpToProjectMatrix() {
            if (window.parent && typeof window.parent.switchPage === 'function') {
                window.parent.switchPage('page-matrix.html');
            } else {
                window.location.href = 'page-matrix.html';
            }
        }
    </script>
</body>
</html>
