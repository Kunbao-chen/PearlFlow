<!DOCTYPE html>
<!--
==========================================================================
PearlFlow - 專案進度矩陣
@file        page-matrix.html
@version     1.2.0
@updated     2026-08-18
@description 全域 Icon 抽換，新增彈性建立專案與動態步驟對接功能
==========================================================================
-->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專案進度矩陣</title>
    <link rel="stylesheet" href="css/theme.css?v=1.2.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global-config.js?v=1.0.6"></script>
    <script src="js/icons.js?v=1.1.0"></script>
    <style>
        * { box-sizing: border-box; }
        body { padding: 24px; font-family: system-ui, -apple-system, sans-serif; background: transparent; margin: 0; }
        
        .header-bar {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;
        }

        .btn-primary {
            background: var(--primary-color); color: #fff; border: none; padding: 10px 18px;
            border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
            box-shadow: 0 2px 8px rgba(217,107,122,0.3); transition: all 0.2s;
        }
        .btn-primary:hover { background: var(--primary-hover); }

        .btn-secondary {
            background: #fff; color: var(--text-primary); border: 1px solid var(--border-color);
            padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.88rem;
            display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
        }
        .btn-secondary:hover { border-color: var(--primary-color); color: var(--primary-color); }

        /* 矩陣表格樣式 */
        .matrix-table {
            width: 100%; border-collapse: separate; border-spacing: 0;
            background: rgba(255, 255, 255, 0.92); border: 1px solid var(--border-color);
            border-radius: 10px; overflow: hidden; backdrop-filter: blur(8px);
            box-shadow: var(--shadow-soft);
        }

        .matrix-table th, .matrix-table td {
            padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--border-color);
        }

        .matrix-table th {
            background: var(--primary-light); color: var(--primary-color);
            font-weight: 600; font-size: 0.92rem;
        }

        .matrix-table tr:last-child td { border-bottom: none; }

        .status-badge {
            display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px;
            border-radius: 20px; font-size: 0.82rem; font-weight: 600; background: #E8F5E9; color: #2E7D32;
        }

        /* Modal 建立新專案彈窗 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none;
            justify-content: center; align-items: center; z-index: 100;
        }
        .modal-body {
            background: #fff; width: 620px; max-width: 92%; max-height: 85vh; overflow-y: auto;
            border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: #444; }
        .form-control { width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; }
        
        .dynamic-task-row {
            display: grid; grid-template-columns: 2fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center;
        }
    </style>
</head>
<body>

    <div class="header-bar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span data-pf-icon="list" data-size="22" style="color: var(--primary-color);"></span>
            <h2 style="margin: 0; color: var(--primary-color); font-size: 1.25rem;">客戶 x 服務類別 專案進度矩陣</h2>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-secondary" onclick="location.reload()">
                <span data-pf-icon="refresh"></span>
                重新整理
            </button>
            <button class="btn-primary" onclick="openCreateProjectModal()">
                <span data-pf-icon="add"></span>
                建立新專案
            </button>
        </div>
    </div>

    <!-- 專案進度矩陣表 -->
    <table class="matrix-table">
        <thead>
            <tr>
                <th>客戶名稱 \ 服務類別</th>
                <th>營業稅申報</th>
                <th>財稅簽證查核</th>
                <th>教育訓練 / 專案顧問</th>
            </tr>
        </thead>
        <tbody id="matrix-tbody">
            <tr>
                <td style="font-weight: 600;">示範客戶 A 股份有限公司</td>
                <td><span class="status-badge">已完成 (100%)</span></td>
                <td style="color: #aaa;">-</td>
                <td style="color: #aaa;">-</td>
            </tr>
            <tr>
                <td style="font-weight: 600;">示範客戶 B 科技股份有限公司</td>
                <td style="color: #aaa;">-</td>
                <td><span class="status-badge">已完成 (100%)</span></td>
                <td style="color: #aaa;">-</td>
            </tr>
        </tbody>
    </table>

    <!-- 建立新專案 Modal -->
    <div class="modal-overlay" id="createProjectModal">
        <div class="modal-body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="margin: 0; color: var(--primary-color); font-size: 1.15rem;">新增事務所服務專案</h3>
                <span data-pf-icon="close" style="cursor: pointer; color: #888;" onclick="closeCreateProjectModal()"></span>
            </div>

            <div class="form-group">
                <label>選擇目標客戶</label>
                <select class="form-control" id="project-client">
                    <option>示範客戶 A 股份有限公司</option>
                    <option>示範客戶 B 科技股份有限公司</option>
                    <option>＋ 新增其他客戶</option>
                </select>
            </div>

            <div class="form-group">
                <label>專案名稱</label>
                <input type="text" class="form-control" id="project-name" placeholder="例：2026 員工內部稅務教育訓練">
            </div>

            <div class="form-group">
                <label>套用步驟模板 (快速帶出預設 SOP)</label>
                <select class="form-control" id="project-template-select" onchange="applyTemplateTasks(this.value)">
                    <option value="">-- 不套用模板 (全自訂步驟) --</option>
                    <option value="tax">營業稅申報標準流程</option>
                    <option value="training">客戶內部教育訓練</option>
                </select>
            </div>

            <div class="form-group">
                <label style="display: flex; justify-content: space-between; align-items: center;">
                    <span>專案執行步驟 (可自由增刪微調)</span>
                    <button type="button" onclick="addCustomTaskRow()" style="color: var(--primary-color); border: none; background: none; cursor: pointer; font-size: 0.82rem; font-weight: 600;">＋ 新增步驟</button>
                </label>
                <div id="project-tasks-list">
                    <!-- 動態帶入步驟項目 -->
                </div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 16px;">
                <button type="button" class="btn-secondary" onclick="closeCreateProjectModal()">取消</button>
                <button type="button" class="btn-primary" onclick="submitCreateProject()">建立專案</button>
            </div>
        </div>
    </div>

    <script>
        // 預設模板步驟資料庫
        const templateLibrary = {
            'tax': [
                { name: '蒐集發票憑證', days: 3 },
                { name: '登錄進銷項資料', days: 5 },
                { name: '編製 401 申報書', days: 7 },
                { name: '完成網路關貿申報', days: 10 }
            ],
            'training': [
                { name: '訪談客戶確定培訓大綱', days: 2 },
                { name: '撰寫簡報與講義教材', days: 7 },
                { name: '現場授課與 Q&A 研討', days: 10 }
            ]
        };

        function openCreateProjectModal() {
            document.getElementById('createProjectModal').style.display = 'flex';
            if (document.getElementById('project-tasks-list').children.length === 0) {
                addCustomTaskRow();
            }
        }

        function closeCreateProjectModal() {
            document.getElementById('createProjectModal').style.display = 'none';
        }

        // 套用模板並自動填入步驟
        function applyTemplateTasks(templateKey) {
            const container = document.getElementById('project-tasks-list');
            container.innerHTML = '';

            if (!templateKey || !templateLibrary[templateKey]) {
                addCustomTaskRow();
                return;
            }

            templateLibrary[templateKey].forEach(task => {
                addTaskRowDOM(task.name, task.days);
            });
        }

        function addCustomTaskRow() {
            addTaskRowDOM('', 3);
        }

        function addTaskRowDOM(taskName = '', days = 3) {
            const container = document.getElementById('project-tasks-list');
            const div = document.createElement('div');
            div.className = 'dynamic-task-row';
            div.innerHTML = `
                <input type="text" class="form-control" placeholder="步驟任務名稱" value="${taskName}">
                <input type="number" class="form-control" placeholder="天數" value="${days}">
                <button type="button" onclick="this.parentElement.remove()" style="color: #d32f2f; border: none; background: none; cursor: pointer;">✕</button>
            `;
            container.appendChild(div);
        }

        function submitCreateProject() {
            const client = document.getElementById('project-client').value;
            const name = document.getElementById('project-name').value;
            if (!name) {
                alert('請輸入專案名稱');
                return;
            }

            alert(`專案「${name}」已成功建立！已成功派發任務給同仁。`);
            closeCreateProjectModal();
        }
    </script>
</body>
</html>
