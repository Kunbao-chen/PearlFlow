<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>專案進度矩陣</title>
    <link rel="stylesheet" href="css/theme.css?v=1.2.0">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global-config.js?v=1.0.6"></script>
    <script src="js/icons.js?v=1.1.0"></script>
    <style>
        * { box-sizing: border-box; }
        body { padding: 24px; font-family: system-ui, -apple-system, sans-serif; background: transparent; margin: 0; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-primary { background: var(--primary-color); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #fff; color: var(--text-primary); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px; }
        .matrix-table { width: 100%; border-collapse: separate; border-spacing: 0; background: rgba(255, 255, 255, 0.92); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; }
        .matrix-table th, .matrix-table td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .matrix-table th { background: var(--primary-light); color: var(--primary-color); font-weight: 600; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-body { background: #fff; width: 620px; max-width: 92%; max-height: 85vh; overflow-y: auto; border-radius: 12px; padding: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; }
        .form-control { width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; }
        .dynamic-task-row { display: grid; grid-template-columns: 2fr 1fr auto; gap: 8px; margin-bottom: 8px; align-items: center; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span data-pf-icon="list" data-size="22" style="color: var(--primary-color);"></span>
            <h2 style="margin: 0; color: var(--primary-color); font-size: 1.25rem;">專案進度矩陣</h2>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-secondary" onclick="loadMatrixData()">
                <span data-pf-icon="refresh"></span> 重新整理
            </button>
            <button class="btn-primary" onclick="openCreateProjectModal()">
                <span data-pf-icon="add"></span> 建立新專案
            </button>
        </div>
    </div>

    <table class="matrix-table">
        <thead>
            <tr>
                <th>客戶名稱</th>
                <th>專案名稱</th>
                <th>專案步驟進度</th>
            </tr>
        </thead>
        <tbody id="matrix-tbody">
            <tr><td colspan="3" style="text-align: center; color: #888;">資料載入中...</td></tr>
        </tbody>
    </table>

    <!-- 建立新專案 Modal -->
    <div class="modal-overlay" id="createProjectModal">
        <div class="modal-body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="margin: 0; color: var(--primary-color);">新增事務所服務專案</h3>
                <span data-pf-icon="close" style="cursor: pointer; color: #888;" onclick="closeCreateProjectModal()"></span>
            </div>

            <div class="form-group">
                <label>選擇目標客戶</label>
                <select class="form-control" id="project-client-select" onchange="handleClientSelectChange(this.value)">
                    <option value="">-- 請選擇客戶 --</option>
                    <option value="NEW_CLIENT" style="color: var(--primary-color); font-weight: bold;">＋ 新增其他客戶...</option>
                </select>
            </div>

            <div class="form-group">
                <label>專案名稱</label>
                <input type="text" class="form-control" id="project-name" placeholder="例：2026 員工內部稅務教育訓練">
            </div>

            <div class="form-group">
                <label>套用步驟模板</label>
                <select class="form-control" id="project-template-select" onchange="applyTemplateTasks(this.value)">
                    <option value="">-- 全自訂步驟 --</option>
                    <option value="tax">營業稅申報標準流程</option>
                    <option value="training">客戶內部教育訓練</option>
                </select>
            </div>

            <div class="form-group">
                <label style="display: flex; justify-content: space-between;">
                    <span>專案執行步驟</span>
                    <button type="button" onclick="addCustomTaskRow()" style="color: var(--primary-color); border: none; background: none; cursor: pointer; font-weight: 600;">＋ 新增步驟</button>
                </label>
                <div id="project-tasks-list"></div>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 16px;">
                <button type="button" class="btn-secondary" onclick="closeCreateProjectModal()">取消</button>
                <button type="button" class="btn-primary" id="btn-submit-project" onclick="submitCreateProject()">確認建立並同步至雲端</button>
            </div>
        </div>
    </div>

    <script>
        const templateLibrary = {
            'tax': [ { name: '蒐集發票憑證', days: 3 }, { name: '登錄進銷項資料', days: 5 }, { name: '完成網路關貿申報', days: 10 } ],
            'training': [ { name: '訪談客戶確定大綱', days: 2 }, { name: '撰寫講義教材', days: 7 }, { name: '現場授課與 Q&A', days: 10 } ]
        };

        // 頁面載入後自動讀取雲端資料
        document.addEventListener('DOMContentLoaded', async () => {
            await loadClientsDropdown();
            await loadMatrixData();
        });

        // 1. 讀取客戶清單至下拉選單
        async function loadClientsDropdown() {
            const select = document.getElementById('project-client-select');
            if (!window.supabase) return;

            const { data: clients, error } = await window.supabase.from('clients').select('id, name').order('name');
            if (error) return console.error('無法讀取客戶清單:', error);

            select.innerHTML = '<option value="">-- 請選擇客戶 --</option>';
            clients.forEach(c => {
                select.innerHTML += `<option value="${c.id}">${c.name}</option>`;
            });
            select.innerHTML += '<option value="NEW_CLIENT" style="color: var(--primary-color); font-weight: bold;">＋ 新增其他客戶...</option>';
        }

        // 2. 處理新增客戶邏輯
        async function handleClientSelectChange(val) {
            if (val === 'NEW_CLIENT') {
                const clientName = prompt('請輸入新客戶名稱（例：台積電股份有限公司）：');
                if (!clientName) {
                    document.getElementById('project-client-select').value = '';
                    return;
                }

                // 寫入 Supabase clients 表
                const { data, error } = await window.supabase.from('clients').insert([{ name: clientName }]).select();
                if (error) {
                    alert('新增客戶失敗：' + error.message);
                    return;
                }

                alert(`客戶「${clientName}」已成功新增至雲端！`);
                await loadClientsDropdown();
                document.getElementById('project-client-select').value = data[0].id;
            }
        }

        function openCreateProjectModal() {
            document.getElementById('createProjectModal').style.display = 'flex';
            if (document.getElementById('project-tasks-list').children.length === 0) addCustomTaskRow();
        }

        function closeCreateProjectModal() {
            document.getElementById('createProjectModal').style.display = 'none';
        }

        function applyTemplateTasks(key) {
            const container = document.getElementById('project-tasks-list');
            container.innerHTML = '';
            if (!key || !templateLibrary[key]) { addCustomTaskRow(); return; }
            templateLibrary[key].forEach(t => addTaskRowDOM(t.name, t.days));
        }

        function addCustomTaskRow() { addTaskRowDOM('', 3); }

        function addTaskRowDOM(name = '', days = 3) {
            const div = document.createElement('div');
            div.className = 'dynamic-task-row';
            div.innerHTML = `
                <input type="text" class="form-control task-name-input" placeholder="步驟名稱" value="${name}">
                <input type="number" class="form-control task-days-input" placeholder="天數" value="${days}">
                <button type="button" onclick="this.parentElement.remove()" style="color: #d32f2f; border: none; background: none; cursor: pointer;">✕</button>
            `;
            document.getElementById('project-tasks-list').appendChild(div);
        }

        // 3. 真實寫入 Supabase 資料庫
        async function submitCreateProject() {
            const clientId = document.getElementById('project-client-select').value;
            const projectName = document.getElementById('project-name').value.trim();
            const btn = document.getElementById('btn-submit-project');

            if (!clientId || clientId === 'NEW_CLIENT') return alert('請選擇有效的目標客戶');
            if (!projectName) return alert('請輸入專案名稱');

            btn.disabled = true;
            btn.innerText = '寫入雲端中...';

            try {
                // Step A: 寫入 projects 表
                const { data: projectData, error: pError } = await window.supabase
                    .from('projects')
                    .insert([{ client_id: clientId, name: projectName, status: '進行中' }])
                    .select();

                if (pError) throw pError;
                const projectId = projectData[0].id;

                // Step B: 蒐集步驟並批次寫入 project_tasks 表
                const taskRows = document.querySelectorAll('.dynamic-task-row');
                const tasksToInsert = [];

                taskRows.forEach((row, index) => {
                    const tName = row.querySelector('.task-name-input').value.trim();
                    const tDays = row.querySelector('.task-days-input').value;
                    if (tName) {
                        tasksToInsert.push({
                            project_id: projectId,
                            task_name: tName,
                            days_required: parseInt(tDays) || 1,
                            sort_order: index + 1
                        });
                    }
                });

                if (tasksToInsert.length > 0) {
                    const { error: tError } = await window.supabase.from('project_tasks').insert(tasksToInsert);
                    if (tError) throw tError;
                }

                alert('專案已成功同步至 Supabase 雲端！');
                closeCreateProjectModal();
                await loadMatrixData(); // 重新讀取雲端資料
            } catch (err) {
                alert('寫入雲端失敗：' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = '確認建立並同步至雲端';
            }
        }

        // 4. 從雲端讀取矩陣資料並渲染
        async function loadMatrixData() {
            const tbody = document.getElementById('matrix-tbody');
            if (!window.supabase) return;

            const { data: projects, error } = await window.supabase
                .from('projects')
                .select('id, name, clients(name), project_tasks(task_name)')
                .order('created_at', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="3" style="color: red;">讀取失敗：${error.message}</td></tr>`;
                return;
            }

            if (!projects || projects.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #888;">目前雲端資料庫尚無專案資料</td></tr>`;
                return;
            }

            tbody.innerHTML = projects.map(p => {
                const clientName = p.clients ? p.clients.name : '未知客戶';
                const taskCount = p.project_tasks ? p.project_tasks.length : 0;
                return `
                    <tr>
                        <td style="font-weight: 600;">${clientName}</td>
                        <td>${p.name}</td>
                        <td>含 ${taskCount} 個執行步驟</td>
                    </tr>
                `;
            }).join('');
        }
    </script>
</body>
</html>
