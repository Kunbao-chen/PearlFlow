<!DOCTYPE html>
<!--
==========================================================================
PearlFlow - 客戶管理 (CRM) v1.3.3 (基於 v1.3.2 穩定版微調專案跳轉參數)
@file        page-crm.html
==========================================================================
-->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客戶管理 (CRM)</title>
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global-config.js"></script>
    <script src="js/auth-guard.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { padding: 24px; font-family: system-ui, -apple-system, sans-serif; background: transparent; margin: 0; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-primary { background: var(--primary-color); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #fff; color: var(--text-primary); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px; }

        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; background: rgba(255, 255, 255, 0.92); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; backdrop-filter: blur(8px); box-shadow: var(--shadow-soft); }
        .data-table th, .data-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        .data-table th { background: var(--primary-light); color: var(--primary-color); font-weight: 600; font-size: 0.92rem; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-body { background: #fff; width: 680px; max-width: 95%; max-height: 90vh; overflow-y: auto; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

        .form-row { display: flex; gap: 16px; }
        .form-group { flex: 1; margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: #444; }
        .form-control { width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; }

        .btn-sm { padding: 5px 10px; font-size: 0.82rem; border-radius: 4px; border: 1px solid var(--border-color); background: #fff; cursor: pointer; }
        .btn-sm:hover { border-color: var(--primary-color); color: var(--primary-color); }
        .btn-danger-sm { color: #DC3545; border-color: #FFCDD2; }
        .btn-danger-sm:hover { background: #FFE6E6; }

        .project-dropdown { width: 100%; padding: 7px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; background: #fff; color: var(--text-primary); outline: none; transition: border-color 0.2s; }
        .project-dropdown:focus { border-color: var(--primary-color); }
    </style>
</head>
<body>

    <div class="header-bar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span data-pf-icon="users" data-size="22" style="color: var(--primary-color);"></span>
            <h2 style="margin: 0; color: var(--primary-color); font-size: 1.25rem;">客戶管理 (CRM)</h2>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-secondary" onclick="loadClients()">重新整理</button>
            <button class="btn-primary" data-pf-role="boss,pm,hr" onclick="openClientModal()">＋ 新增客戶</button>
        </div>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th style="width: 110px;">統一編號</th>
                <th style="width: 180px;">客戶名稱</th>
                <th style="width: 160px;">主要聯絡人 / 電話</th>
                <th style="width: 120px;">主辦人員</th>
                <th>進行中專案 (快速跳轉)</th>
                <th style="width: 150px;">操作</th>
            </tr>
        </thead>
        <tbody id="crm-tbody">
            <tr><td colspan="6" style="text-align: center; color: #888;">資料載入中...</td></tr>
        </tbody>
    </table>

    <!-- 新增 / 編輯客戶 Modal -->
    <div class="modal-overlay" id="clientModal">
        <div class="modal-body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 id="modal-title" style="margin: 0; color: var(--primary-color); font-size: 1.15rem;">新增客戶資料</h3>
                <span style="cursor: pointer; color: #888; font-weight: bold;" onclick="closeModal('clientModal')">✕</span>
            </div>

            <input type="hidden" id="client-id">

            <div class="form-row">
                <div class="form-group">
                    <label>統一編號 (8碼) *</label>
                    <input type="text" class="form-control" id="client-tax-id" placeholder="例：12345678">
                </div>
                <div class="form-group">
                    <label>客戶名稱 (公司全銜) *</label>
                    <input type="text" class="form-control" id="client-name" placeholder="例：珍珠科技股份有限公司">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>公司負責人</label>
                    <input type="text" class="form-control" id="client-owner" placeholder="例：張董事長">
                </div>
                <div class="form-group">
                    <label>主辦人員 (事務所對應窗口)</label>
                    <select class="form-control" id="client-manager"></select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>主要聯絡人</label>
                    <input type="text" class="form-control" id="client-contact" placeholder="例：陳會計經理">
                </div>
                <div class="form-group">
                    <label>聯絡電話 / 手機</label>
                    <input type="text" class="form-control" id="client-phone" placeholder="例：02-2345-6789">
                </div>
            </div>

            <div class="form-group">
                <label>聯絡人 Email</label>
                <input type="email" class="form-control" id="client-email" placeholder="例：finance@client.com">
            </div>

            <div class="form-group">
                <label>通訊 / 寄單地址</label>
                <input type="text" class="form-control" id="client-address" placeholder="例：台北市信義區信義路五段7號">
            </div>

            <div class="form-group">
                <label>重要備註 (特殊稅務或服務需求)</label>
                <textarea class="form-control" id="client-notes" rows="3" placeholder="註記客戶發票開立偏好、結帳週期或重要備忘..."></textarea>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; border-top: 1px solid var(--border-color); padding-top: 16px;">
                <button class="btn-secondary" onclick="closeModal('clientModal')">取消</button>
                <button class="btn-primary" id="btn-save-client" onclick="submitClientForm()">儲存客戶資料</button>
            </div>
        </div>
    </div>

    <script>
        let dbMembersCache = [];
        let dbProjectsCache = [];

        document.addEventListener('DOMContentLoaded', async () => {
            await loadMembersDropdown();
            await loadClients();
        });

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // 精確取得 global-config.js 初始化出來的 Supabase Client 實例[cite: 7]
        function getDbClient() {
            if (window._supabaseClient) return window._supabaseClient;
            if (window.supabaseClient) return window.supabaseClient;
            if (window.supabase && typeof window.supabase.from === 'function') return window.supabase;
            return null;
        }

        async function loadMembersDropdown() {
            const client = getDbClient();
            if (!client) return;
            try {
                const { data } = await client.from('members').select('name').eq('is_active', true);
                dbMembersCache = data || [];
                const select = document.getElementById('client-manager');
                if (select) {
                    select.innerHTML = `<option value="">-- 指定主辦人員 --</option>` + 
                        dbMembersCache.map(m => `<option value="${m.name}">👤 ${m.name}</option>`).join('');
                }
            } catch (err) {
                console.error("Members 載入異常:", err);
            }
        }

        async function loadClients() {
            const tbody = document.getElementById('crm-tbody');
            const client = getDbClient();

            if (!client) {
                tbody.innerHTML = `<tr><td colspan="6" style="color: red; text-align: center;">資料庫連線尚未準備就緒，請重新整理頁面</td></tr>`;
                return;
            }

            try {
                // 1. 讀取客戶資料庫 (使用原本 v1.3.2 驗證過的查詢)[cite: 7]
                const clientsRes = await client.from('clients').select('*').order('created_at', { ascending: false });

                if (clientsRes.error) {
                    tbody.innerHTML = `<tr><td colspan="6" style="color: red; text-align: center;">客戶資料讀取失敗：${clientsRes.error.message}</td></tr>`;
                    return;
                }

                const clients = clientsRes.data || [];

                if (clients.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #888;">目前尚無客戶資料，請點擊右上方「＋ 新增客戶」</td></tr>`;
                    return;
                }

                // 2. 獨立讀取專案資料庫[cite: 7]
                try {
                    const projectsRes = await client.from('projects').select('*');
                    dbProjectsCache = projectsRes.data || [];
                } catch (pErr) {
                    console.warn("Projects 資料讀取受阻:", pErr);
                    dbProjectsCache = [];
                }

                const canManage = PearlAuth.hasRole(['boss', 'pm', 'hr']);

                // 3. 渲染客戶與專案下拉選單[cite: 7]
                tbody.innerHTML = clients.map(c => {
                    const matchedProjects = dbProjectsCache.filter(p => 
                        (p.client_id && String(p.client_id) === String(c.id)) ||
                        (p.client_name && p.client_name.trim() === c.name.trim()) ||
                        (p.client && p.client.trim() === c.name.trim())
                    );
                    
                    let projectSelectHtml = '';
                    if (matchedProjects.length > 0) {
                        projectSelectHtml = `
                            <select class="project-dropdown" onchange="jumpToProject(this.value)">
                                <option value="">-- 選擇專案前往 (${matchedProjects.length}) --</option>
                                ${matchedProjects.map(p => `
                                    <option value="${p.id}">📌 ${p.name || p.title || '未命名專案'}</option>
                                `).join('')}
                            </select>
                        `;
                    } else {
                        projectSelectHtml = `<span style="color: #aaa; font-size: 0.85rem;">尚無進行中專案</span>`;
                    }

                    return `
                        <tr>
                            <td style="font-family: monospace; font-weight: 600;">${c.tax_id || '-'}</td>
                            <td style="font-weight: 600; color: var(--primary-color);">${c.name}</td>
                            <td>
                                <div>${c.contact_person || '-'}</div>
                                <div style="font-size: 0.8rem; color: #777;">${c.phone || c.email || ''}</div>
                            </td>
                            <td>${c.manager ? '👤 ' + c.manager : '-'}</td>
                            <td>${projectSelectHtml}</td>
                            <td>
                                <button class="btn-sm" onclick="openClientModal('${c.id}')">✏️ 編輯 / 詳情</button>
                                ${canManage ? `<button class="btn-sm btn-danger-sm" onclick="deleteClient('${c.id}', '${c.name}')">🗑</button>` : ''}
                            </td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error("CRM 載入異常:", err);
                tbody.innerHTML = `<tr><td colspan="6" style="color: red; text-align: center;">系統執行異常：${err.message}</td></tr>`;
            }
        }

        // 精準帶入 openProjectId 參數跳轉至矩陣頁面
        function jumpToProject(projectId) {
            if (!projectId) return;
            const targetUrl = `page-matrix.html?openProjectId=${projectId}`;
            if (window.parent && typeof window.parent.switchPage === 'function') {
                window.parent.switchPage(targetUrl);
            } else {
                window.location.href = targetUrl;
            }
        }

        async function openClientModal(clientId = null) {
            const modal = document.getElementById('clientModal');
            const titleEl = document.getElementById('modal-title');
            const client = getDbClient();
            
            if (clientId && client) {
                titleEl.innerText = '編輯客戶資料';
                const { data: c } = await client.from('clients').select('*').eq('id', clientId).single();
                if (c) {
                    document.getElementById('client-id').value = c.id;
                    document.getElementById('client-tax-id').value = c.tax_id || '';
                    document.getElementById('client-name').value = c.name || '';
                    document.getElementById('client-owner').value = c.owner || '';
                    document.getElementById('client-manager').value = c.manager || '';
                    document.getElementById('client-contact').value = c.contact_person || '';
                    document.getElementById('client-phone').value = c.phone || '';
                    document.getElementById('client-email').value = c.email || '';
                    document.getElementById('client-address').value = c.address || '';
                    document.getElementById('client-notes').value = c.notes || '';
                }
            } else {
                titleEl.innerText = '新增客戶資料';
                document.getElementById('client-id').value = '';
                document.getElementById('client-tax-id').value = '';
                document.getElementById('client-name').value = '';
                document.getElementById('client-owner').value = '';
                document.getElementById('client-manager').value = '';
                document.getElementById('client-contact').value = '';
                document.getElementById('client-phone').value = '';
                document.getElementById('client-email').value = '';
                document.getElementById('client-address').value = '';
                document.getElementById('client-notes').value = '';
            }

            modal.style.display = 'flex';
        }

        async function submitClientForm() {
            const client = getDbClient();
            if (!client) return alert('資料庫連線失敗');

            const clientId = document.getElementById('client-id').value;
            const name = document.getElementById('client-name').value.trim();
            const taxId = document.getElementById('client-tax-id').value.trim();
            const owner = document.getElementById('client-owner').value.trim();
            const manager = document.getElementById('client-manager').value;
            const contact = document.getElementById('client-contact').value.trim();
            const phone = document.getElementById('client-phone').value.trim();
            const email = document.getElementById('client-email').value.trim();
            const address = document.getElementById('client-address').value.trim();
            const notes = document.getElementById('client-notes').value.trim();

            if (!name) return alert('請填寫客戶名稱');

            const payload = {
                name: name,
                tax_id: taxId || null,
                owner: owner || null,
                manager: manager || null,
                contact_person: contact || null,
                phone: phone || null,
                email: email || null,
                address: address || null,
                notes: notes || null
            };

            const btn = document.getElementById('btn-save-client');
            btn.disabled = true;
            btn.innerText = '儲存中...';

            let res;
            if (clientId) {
                res = await client.from('clients').update(payload).eq('id', clientId);
            } else {
                res = await client.from('clients').insert([payload]);
            }

            btn.disabled = false;
            btn.innerText = '儲存客戶資料';

            if (res.error) {
                alert('儲存失敗：' + res.error.message);
            } else {
                alert('客戶資料已成功儲存！');
                closeModal('clientModal');
                loadClients();
            }
        }

        async function deleteClient(clientId, clientName) {
            const client = getDbClient();
            if (!client) return;

            if (confirm(`確定要刪除客戶「${clientName}」嗎？`)) {
                await client.from('clients').delete().eq('id', clientId);
                loadClients();
            }
        }
    </script>
</body>
</html>
