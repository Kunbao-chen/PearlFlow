<!DOCTYPE html>
<!--
==========================================================================
PearlFlow - 客戶管理 (CRM)
@file        page-crm.html
@description 客戶列表與維護，支援顯示進行中專案並快速跳轉至專案進度矩陣
==========================================================================
-->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>客戶管理 (CRM)</title>
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global-config.js"></script>
    <script src="js/icons.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { padding: 24px; font-family: system-ui, -apple-system, sans-serif; background: transparent; margin: 0; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-primary { background: var(--primary-color); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #fff; color: var(--text-primary); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
        .btn-secondary:hover { border-color: var(--primary-color); color: var(--primary-color); }
        
        .crm-table { width: 100%; border-collapse: separate; border-spacing: 0; background: rgba(255, 255, 255, 0.92); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; backdrop-filter: blur(8px); box-shadow: var(--shadow-soft); }
        .crm-table th, .crm-table td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        .crm-table th { background: var(--primary-light); color: var(--primary-color); font-weight: 600; font-size: 0.92rem; }
        .crm-table tbody tr:hover { background: rgba(182, 40, 70, 0.03); }

        .project-select { padding: 6px 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.85rem; color: var(--primary-color); font-weight: 600; background: #fff; cursor: pointer; max-width: 220px; outline: none; }
        .project-select:hover { border-color: var(--primary-color); }
        .badge-none { font-size: 0.85rem; color: #999; font-style: italic; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-body { background: #fff; width: 480px; max-width: 92%; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: #444; }
        .form-control { width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span data-pf-icon="users" data-size="22" style="color: var(--primary-color);"></span>
            <h2 style="margin: 0; color: var(--primary-color); font-size: 1.25rem;">客戶管理 (CRM)</h2>
        </div>
        <div style="display: flex; gap: 10px;">
            <!-- 整合之專案模板管理入口 -->
            <button class="btn-secondary" onclick="navigateToTemplates()">
                <span data-pf-icon="edit"></span> ⚙️ 專案模板管理
            </button>
            <button class="btn-secondary" onclick="loadClientsData()">
                <span data-pf-icon="refresh"></span> 重新整理
            </button>
            <button class="btn-primary" onclick="openCreateClientModal()">
                <span data-pf-icon="add"></span> 新增客戶
            </button>
        </div>
    </div>

    <table class="crm-table">
        <thead>
            <tr>
                <th>客戶名稱</th>
                <th>聯絡人</th>
                <th>聯絡電話 / Email</th>
                <th>進行中專案 (快速跳轉)</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody id="crm-tbody">
            <tr><td colspan="5" style="text-align: center; color: #888;">客戶資料載入中...</td></tr>
        </tbody>
    </table>

    <!-- 新增客戶 Modal -->
    <div class="modal-overlay" id="createClientModal">
        <div class="modal-body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="margin: 0; color: var(--primary-color); font-size: 1.15rem;">新增客戶資料</h3>
                <span data-pf-icon="close" style="cursor: pointer; color: #888;" onclick="closeCreateClientModal()"></span>
            </div>

            <div class="form-group">
                <label>客戶/企業名稱 *</label>
                <input type="text" class="form-control" id="new-client-name" placeholder="例：台積電股份有限公司">
            </div>

            <div class="form-group">
                <label>主要聯絡人</label>
                <input type="text" class="form-control" id="new-client-contact" placeholder="例：王小明 經理">
            </div>

            <div class="form-group">
                <label>聯絡電話</label>
                <input type="text" class="form-control" id="new-client-phone" placeholder="例：02-23456789">
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 16px;">
                <button type="button" class="btn-secondary" onclick="closeCreateClientModal()">取消</button>
                <button type="button" class="btn-primary" id="btn-save-client" onclick="submitCreateClient()">確認儲存</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadClientsData();
        });

        function navigateToTemplates() {
            if (window.parent && typeof window.parent.switchPage === 'function') {
                window.parent.switchPage('page-templates.html');
            } else {
                window.location.href = 'page-templates.html';
            }
        }

        async function loadClientsData() {
            const tbody = document.getElementById('crm-tbody');
            if (!window.supabase) return;

            // 雙向關聯查詢：讀取客戶及該客戶旗下的所有專案
            const { data: clients, error } = await window.supabase
                .from('clients')
                .select('id, name, contact_person, phone, projects(id, name, status)')
                .order('name');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" style="color: red;">載入失敗：${error.message}</td></tr>`;
                return;
            }

            if (!clients || clients.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #888;">目前尚無客戶資料</td></tr>`;
                return;
            }

            tbody.innerHTML = clients.map(client => {
                const projects = client.projects || [];
                let projectDropdownHtml = '';

                if (projects.length === 0) {
                    projectDropdownHtml = `<span class="badge-none">無進行中專案</span>`;
                } else {
                    const options = projects.map(p => `<option value="${p.id}">📌 ${p.name}</option>`).join('');
                    projectDropdownHtml = `
                        <select class="project-select" onchange="jumpToProject(this.value)">
                            <option value="">-- 選擇專案前往 (${projects.length}) --</option>
                            ${options}
                        </select>
                    `;
                }

                return `
                    <tr>
                        <td style="font-weight: 600; color: var(--text-primary);">${client.name}</td>
                        <td>${client.contact_person || '-'}</td>
                        <td>${client.phone || '-'}</td>
                        <td>${projectDropdownHtml}</td>
                        <td>
                            <button class="btn-secondary" style="padding: 4px 8px; font-size: 0.8rem;" onclick="deleteClient('${client.id}', '${client.name}')">
                                刪除
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 跳轉至專案進度矩陣並傳參開啟對應專案Modal
        function jumpToProject(projectId) {
            if (!projectId) return;
            
            const targetUrl = `page-matrix.html?openProjectId=${projectId}`;
            if (window.parent && typeof window.parent.switchPage === 'function') {
                window.parent.switchPage(targetUrl);
            } else {
                window.location.href = targetUrl;
            }
        }

        function openCreateClientModal() {
            document.getElementById('createClientModal').style.display = 'flex';
        }

        function closeCreateClientModal() {
            document.getElementById('createClientModal').style.display = 'none';
        }

        async function submitCreateClient() {
            const name = document.getElementById('new-client-name').value.trim();
            const contact = document.getElementById('new-client-contact').value.trim();
            const phone = document.getElementById('new-client-phone').value.trim();
            const btn = document.getElementById('btn-save-client');

            if (!name) return alert('請輸入客戶名稱');

            btn.disabled = true;
            btn.innerText = '儲存中...';

            const { error } = await window.supabase
                .from('clients')
                .insert([{ name, contact_person: contact, phone }]);

            btn.disabled = false;
            btn.innerText = '確認儲存';

            if (error) {
                alert('新增失敗：' + error.message);
            } else {
                alert('客戶新增成功！');
                closeCreateClientModal();
                loadClientsData();
            }
        }

        async function deleteClient(id, name) {
            if (confirm(`確定要刪除客戶「${name}」嗎？`)) {
                const { error } = await window.supabase.from('clients').delete().eq('id', id);
                if (error) alert('刪除失敗：' + error.message);
                else loadClientsData();
            }
        }
    </script>
</body>
</html>
