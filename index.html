<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>珍珠聯合會計師事務所 - 內部作業管理系統 v2.2.0</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pearl: {
                            50: '#fdf2f4',   // 超淺粉背景
                            100: '#fce7eb',  // 淺粉標籤背景
                            200: '#f8d0d8',  // 邊框與次要按鈕
                            300: '#f2aab8',
                            400: '#ea7a93',
                            500: '#e05373',  // 主按鈕粉色
                            600: '#c93b5d',  // Header Logo 與強調色 (深珍珠粉)
                            700: '#aa2a48',
                            800: '#8d253f',
                            900: '#772237',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-700 min-h-screen flex flex-col font-sans">

    <!-- 頁首導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo / Title -->
                <div class="flex items-center gap-3">
                    <img src="assets/logo.png" alt="珍珠聯合會計師事務所 Logo" class="h-10 w-auto object-contain">
                    <div class="flex items-center gap-2">
                        <h1 class="text-lg font-bold tracking-tight text-slate-800">珍珠聯合會計師事務所</h1>
                        <span class="text-xs font-semibold text-pearl-600 bg-pearl-100 px-2 py-0.5 rounded-full">v2.2.0</span>
                    </div>
                </div>

                <!-- Navigation Tabs -->
                <nav class="flex space-x-1 bg-slate-100 p-1 rounded-xl border border-slate-200 text-sm font-medium">
                    <button id="nav-matrix" onclick="switchTab('matrix')" class="px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">
                        <i class="fa-solid fa-table-cells mr-1.5"></i>專案矩陣
                    </button>
                    <button id="nav-kanban" onclick="switchTab('kanban')" class="px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">
                        <i class="fa-solid fa-list-check mr-1.5"></i>Task Focus 看板
                    </button>
                    <button id="nav-analytics" onclick="switchTab('analytics')" class="px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">
                        <i class="fa-solid fa-chart-pie mr-1.5"></i>管理分析
                    </button>
                </nav>

                <!-- Role Switcher -->
                <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 p-1.5 rounded-lg text-xs">
                    <span class="text-slate-500 font-medium ml-1">權限切換:</span>
                    <button id="role-admin" onclick="setRole('admin')" class="px-2.5 py-1 rounded font-bold transition">老闆 (Admin)</button>
                    <button id="role-staff" onclick="setRole('staff')" class="px-2.5 py-1 rounded font-bold transition">員工 (Staff)</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- VIEW 1: 專案矩陣 VIEW -->
        <section id="view-matrix" class="space-y-6">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">專案總覽矩陣</h2>
                    <p class="text-xs text-slate-500 mt-1">點擊專案卡片可進入詳細客戶步驟控管進度表</p>
                </div>
                <div id="admin-project-actions" class="hidden">
                    <button onclick="openProjectModal()" class="px-3.5 py-2 bg-pearl-600 hover:bg-pearl-700 text-white rounded-lg text-xs font-bold shadow-sm transition flex items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i> 新增專案
                    </button>
                </div>
            </div>

            <!-- 專案列表 (Grid) -->
            <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>

            <!-- 專案詳細進度表 -->
            <div id="project-detail-panel" class="hidden bg-white border border-slate-200 rounded-xl shadow-sm p-5 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <div class="flex items-center gap-3">
                        <h3 id="detail-project-name" class="text-base font-bold text-slate-800"></h3>
                        <span id="detail-project-cycle" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium"></span>
                    </div>
                    <button onclick="closeProjectDetail()" class="text-slate-400 hover:text-slate-600 text-sm p-1">
                        <i class="fa-solid fa-xmark"></i> 關閉細節
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr id="matrix-table-head" class="bg-slate-50 text-slate-600 border-b border-slate-200"></tr>
                        </thead>
                        <tbody id="matrix-table-body" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- VIEW 2: TASK FOCUS 看板 VIEW -->
        <section id="view-kanban" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">Task Focus 聚焦看板</h2>
                    <p class="text-xs text-slate-500 mt-1">呈現跨專案需處置之客戶與時程警告資訊</p>
                </div>
            </div>
            <div id="kanban-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>

        <!-- VIEW 3: 管理分析 VIEW -->
        <section id="view-analytics" class="hidden space-y-6">
            <div>
                <h2 class="text-xl font-bold text-slate-800">管理分析儀表板</h2>
                <p class="text-xs text-slate-500 mt-1">即時檢視團隊工時統計、每日工時標籤與專案整體完成率</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- 人員工時統計 -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2">
                        <i class="fa-solid fa-clock text-pearl-600 mr-1.5"></i>人員每日工時檢析
                    </h3>
                    <div id="analytics-staff-list" class="space-y-3"></div>
                </div>

                <!-- 專案累積工時與進度統計 -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2">
                        <i class="fa-solid fa-chart-column text-pearl-600 mr-1.5"></i>專案累積耗時與進度
                    </h3>
                    <div id="analytics-project-list" class="space-y-3"></div>
                </div>
            </div>
        </section>

    </main>

    <!-- MODAL 1: 計時器與紀錄彈窗 (Timer Modal) -->
    <div id="timer-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 max-w-sm w-full p-5 space-y-4">
            <div class="flex justify-between items-start">
                <div>
                    <span id="modal-client-name" class="text-xs font-bold text-pearl-600 bg-pearl-50 px-2 py-0.5 rounded border border-pearl-100">客戶名稱</span>
                    <h4 id="modal-step-name" class="text-base font-bold text-slate-800 mt-1">步驟名稱</h4>
                </div>
                <button onclick="closeTimerModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 text-center space-y-1">
                <div id="timer-display" class="font-mono text-3xl font-bold text-slate-800">00:00:00</div>
                <div class="flex items-center justify-center gap-2 text-xs text-slate-500">
                    <span id="timer-status-badge" class="font-semibold">未開始</span>
                    <span>•</span>
                    <span id="timer-user-info">無紀錄</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-2">
                <button id="btn-start" onclick="handleTimerAction('start')" class="py-2.5 bg-pearl-500 hover:bg-pearl-600 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> 開始執行
                </button>
                <button id="btn-resume" onclick="handleTimerAction('resume')" class="py-2.5 bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> 繼續執行
                </button>
                <button id="btn-pause" onclick="handleTimerAction('pause')" class="py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-pause"></i> 暫停執行
                </button>
                <button id="btn-complete" onclick="handleTimerAction('complete')" class="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check"></i> 完成此步驟
                </button>
                <button id="btn-skip" onclick="handleTimerAction('skip')" class="col-span-2 py-2 text-slate-500 hover:bg-slate-100 rounded-lg text-xs font-medium border border-slate-200">
                    標記為「無此步驟」
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: 新增/編輯專案彈窗 (Admin Only) -->
    <div id="project-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 max-w-md w-full p-5 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h4 class="text-base font-bold text-slate-800">專案規格設定</h4>
                <button onclick="closeProjectModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">專案名稱</label>
                    <input id="input-proj-name" type="text" placeholder="例如：113年度營利事業所得稅結算申報" class="w-full border border-slate-200 rounded-lg p-2 focus:ring-2 focus:ring-pearl-500 outline-none">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">週期類型</label>
                    <select id="input-proj-cycle" class="w-full border border-slate-200 rounded-lg p-2 focus:ring-2 focus:ring-pearl-500 outline-none">
                        <option value="none">非固定週期</option>
                        <option value="monthly">每月固定週期</option>
                        <option value="bimonthly">雙月固定週期 (如營業稅)</option>
                        <option value="annual">每年固定週期</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">申報/完成截止日</label>
                    <input id="input-proj-deadline" type="date" class="w-full border border-slate-200 rounded-lg p-2 focus:ring-2 focus:ring-pearl-500 outline-none">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">標準作業步驟 (一行一步驟)</label>
                    <textarea id="input-proj-steps" rows="4" placeholder="憑證整理&#10;帳務登錄&#10;試算表產出&#10;客戶確認" class="w-full border border-slate-200 rounded-lg p-2 focus:ring-2 focus:ring-pearl-500 outline-none font-mono"></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button onclick="closeProjectModal()" class="px-3 py-1.5 text-slate-500 border border-slate-200 rounded-lg text-xs font-semibold">取消</button>
                <button onclick="saveProject()" class="px-4 py-1.5 bg-pearl-600 text-white rounded-lg text-xs font-bold hover:bg-pearl-700">儲存專案</button>
            </div>
        </div>
    </div>

    <!-- 依序載入腳本模組 -->
    <script src="js/config.js"></script>
    <script src="js/services.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
