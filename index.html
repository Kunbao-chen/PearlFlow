<!DOCTYPE html>
<!--
==========================================================================
PearlFlow - 主系統外框
@file        index.html
@description 系統導覽列與 iframe 主畫面外框（採用不鎖版號引入機制）
==========================================================================
-->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PearlFlow - 珍珠聯合會計師事務所</title>
    <!-- 不鎖版號引入 -->
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global-config.js"></script>
    <script src="js/icons.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #app-container { display: flex; width: 100vw; height: 100vh; }
        #sidebar {
            width: 250px; flex-shrink: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column;
            box-shadow: 2px 0 15px rgba(0,0,0,0.03); z-index: 10;
        }
        .brand {
            padding: 16px 20px; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center;
            height: 65px; box-sizing: border-box; background: #FFFFFF;
        }
        .brand img { max-width: 100%; max-height: 38px; object-fit: contain; }
        #main-wrapper { flex: 1; display: flex; flex-direction: column; width: calc(100vw - 250px); height: 100vh; overflow: hidden; }
        #header {
            height: var(--header-height, 60px); background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 24px; flex-shrink: 0;
        }
        #header .page-title h3 { margin: 0; font-size: 1.1rem; color: var(--primary-color); font-weight: 600; letter-spacing: 0.5px; }
        #content-frame { width: 100%; height: calc(100vh - 60px); border: none; display: block; background: transparent; }
        .btn-logout {
            margin-top: 8px; width: 100%; padding: 8px; background: #FFF5F6;
            color: var(--primary-color); border: 1px solid #FCD4D9; border-radius: 6px;
            cursor: pointer; font-weight: 500; transition: all 0.2s ease;
        }
        .btn-logout:hover { background: var(--primary-color); color: #FFFFFF; }
    </style>
</head>
<body>
    <div id="app-container">
        <aside id="sidebar">
            <div class="brand">
                <img src="logo.png" alt="珍珠聯合會計師事務所 Logo">
            </div>
            
            <nav style="flex: 1; padding: 16px 0; overflow-y: auto;">
                <a href="#" class="nav-item active" data-page="page-dashboard.html">
                    <span data-pf-icon="dashboard"></span>
                    <span>Dashboard 儀表板</span>
                </a>
                <a href="#" class="nav-item" data-page="page-matrix.html">
                    <span data-pf-icon="matrix"></span>
                    <span>專案進度矩陣</span>
                </a>
                <a href="#" class="nav-item" data-page="page-templates.html">
                    <span data-pf-icon="templates"></span>
                    <span>專案模板管理</span>
                </a>
                <a href="#" class="nav-item" data-page="page-calendar.html">
                    <span data-pf-icon="calendar"></span>
                    <span>事務所行事曆</span>
                </a>
                <a href="#" class="nav-item" data-page="page-crm.html">
                    <span data-pf-icon="crm"></span>
                    <span>客戶管理 (CRM)</span>
                </a>
                <a href="#" class="nav-item" data-page="page-reports.html">
                    <span data-pf-icon="reports"></span>
                    <span>管理分析報表</span>
                </a>
            </nav>

            <div class="user-profile" style="padding: 16px; border-top: 1px solid var(--border-color); margin-top: auto;">
                <div style="font-size: 0.82rem; color: var(--text-muted);">目前登入使用者：</div>
                <span id="user-display-name" style="font-size: 0.88rem; color: var(--text-primary); font-weight: 600; word-break: break-all;">載入中...</span>
                <button class="btn-logout" onclick="handleLogout()">登出系統</button>
            </div>
        </aside>

        <div id="main-wrapper">
            <header id="header">
                <div class="page-title">
                    <h3 id="current-page-name">Dashboard 儀表板</h3>
                </div>
            </header>
            <iframe id="content-frame" src="page-dashboard.html"></iframe>
        </div>
    </div>

    <script>
        document.querySelectorAll('#sidebar nav .nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');
                const pageUrl = this.getAttribute('data-page');
                const pageTitle = this.querySelector('span:last-child').innerText.trim();
                document.getElementById('current-page-name').innerText = pageTitle;
                document.getElementById('content-frame').src = pageUrl;
            });
        });

        async function handleLogout() {
            if (confirm('確定要登出系統嗎？')) {
                if (window.supabase) await window.supabase.auth.signOut();
                sessionStorage.clear();
                window.location.reload();
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (window.supabase) {
                const { data: { session } } = await window.supabase.auth.getSession();
                document.getElementById('user-display-name').innerText = session ? (session.user.email || '使用者') : '未登入 (訪客模式)';
            }
        });
    </script>
</body>
</html>
