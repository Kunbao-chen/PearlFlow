<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PearlFlow - 珍珠聯合會計師事務所</title>
    <link rel="stylesheet" href="css/theme.css?v=1.0.3">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global-config.js?v=1.0.6"></script>
    <style>
        /* 強制將外殼主框架拉到 100% 寬度 */
        #main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: calc(100% - 240px); /* 扣除側邊欄寬度 */
            height: 100vh;
            overflow: hidden;
        }

        #content-frame {
            width: 100% !important;
            height: calc(100vh - var(--header-height, 60px)) !important;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div id="app-container" style="display: flex; width: 100vw; height: 100vh; overflow: hidden;">
        <aside id="sidebar">
            <div class="brand">
                <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
                <div class="brand-title">
                    <span class="main-name">珍珠聯合會計師事務所</span>
                </div>
            </div>
            <nav>
                <a href="#" class="nav-item active" data-page="page-dashboard.html"> Dashboard 儀表板</a>
                <a href="#" class="nav-item" data-page="page-matrix.html"> 專案進度矩陣</a>
                <a href="#" class="nav-item" data-page="page-calendar.html"> 事務所行事曆</a>
            </nav>
            <div class="user-profile" style="padding: 16px; border-top: 1px solid var(--border-color); margin-top: auto;">
                <span id="user-display-name" style="font-size: 0.85rem; color: var(--text-muted);">載入中...</span>
                <button onclick="handleLogout()" style="margin-top: 8px; width: 100%; padding: 6px; background: #FFF0F0; color: #D32F2F; border: 1px solid #FFCDD2; border-radius: 4px; cursor: pointer;">登出</button>
            </div>
        </aside>

        <div id="main-wrapper">
            <header id="header">
                <div class="page-title">
                    <h3 id="current-page-name">Dashboard 儀表板</h3>
                </div>
            </header>
            <iframe id="content-frame" src="page-dashboard.html"></iframe>
        </div>
    </div>

    <script>
        // 側邊欄切換邏輯
        document.querySelectorAll('#sidebar nav .nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');

                const pageUrl = this.getAttribute('data-page');
                const pageTitle = this.innerText.trim();
                
                document.getElementById('current-page-name').innerText = pageTitle;
                document.getElementById('content-frame').src = pageUrl;
            });
        });

        // 登出處理
        async function handleLogout() {
            if (confirm('確定要登出系統嗎？')) {
                if (window.supabase) {
                    await window.supabase.auth.signOut();
                }
                sessionStorage.clear();
                alert('已成功登出');
                window.location.reload();
            }
        }

        // 初始化檢查登入狀態
        window.addEventListener('DOMContentLoaded', async () => {
            if (window.supabase) {
                const { data: { session } } = await window.supabase.auth.getSession();
                if (session) {
                    document.getElementById('user-display-name').innerText = session.user.email || '使用者';
                } else {
                    document.getElementById('user-display-name').innerText = '未登入 (訪客模式)';
                }
            } else {
                document.getElementById('user-display-name').innerText = '系統初始化中';
            }
        });
    </script>
</body>
</html>
