    <body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-900 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl font-bold tracking-wider text-indigo-200">PearlFlow</span>
                    <span class="text-xs bg-indigo-700 text-indigo-100 px-2 py-0.5 rounded-full font-mono">v2.1.1</span>
                </div>
                
                <!-- 視圖切換與角色切換 -->
                <div class="flex items-center space-x-4">
                    <nav class="flex space-x-1 bg-indigo-950 p-1 rounded-lg">
                        <button id="nav-matrix" onclick="switchTab('matrix')" class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors bg-indigo-600 text-white">進度矩陣</button>
                        <button id="nav-calendar" onclick="switchTab('calendar')" class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors text-indigo-200 hover:text-white hover:bg-indigo-800">申報行事曆</button>
                        <button id="nav-clients" onclick="switchTab('clients')" class="px-3 py-1.5 text-sm font-medium rounded-md transition-colors text-indigo-200 hover:text-white hover:bg-indigo-800">客戶管理</button>

        <!-- 主要內容區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- 視圖 1: 進度矩陣 (Matrix) -->
        <section id="view-matrix" class="space-y-4">
            <!-- 專案選擇與控制列 -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-3">
                    <label for="project-select" class="text-sm font-semibold text-slate-700">選擇專案：</label>
                    <select id="project-select" onchange="loadProjectMatrix(this.value)" class="bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg focus:ring-indigo-500 focus:border-indigo-500 block p-2 font-medium">
                        <!-- 動態載入專案 -->
                    </select>
                </div>
                <div class="flex items-center space-x-2">
                    <button id="btn-add-project" onclick="openProjectModal()" class="admin-only bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-3 py-2 rounded-lg flex items-center space-x-1 shadow-sm transition-colors">
                        <span>+ 新增專案</span>
                    </button>
                    <button id="btn-add-client" onclick="openClientModal()" class="admin-only bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 text-sm font-medium px-3 py-2 rounded-lg flex items-center space-x-1 transition-colors">
                        <span>+ 新增客戶</span>
                    </button>
                </div>
            </div>

            <!-- 進度矩陣表格 -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto custom-scrollbar">
                    <table class="w-full text-sm text-left text-slate-600">
                        <thead id="matrix-head" class="text-xs text-slate-700 uppercase bg-slate-100 border-b border-slate-200">
                            <!-- 動態生成表頭 -->
                        </thead>
                        <tbody id="matrix-body" class="divide-y divide-slate-200">
                            <!-- 動態生成矩陣內容 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- 視圖 2: 申報行事曆 (Calendar) -->
        <section id="view-calendar" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800">申報行事曆與到期提醒</h2>
                <button onclick="openEventModal()" class="admin-only bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-3 py-2 rounded-lg shadow-sm">
                    + 新增申報日程
                </button>
            </div>
            <div id="calendar-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- 動態生成日程卡片 -->
            </div>
        </section>

        <!-- 視圖 3: 客戶管理 (Clients) -->
        <section id="view-clients" class="space-y-4 hidden">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-800">客戶基本資料管理</h2>
                <button onclick="openClientModal()" class="admin-only bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-3 py-2 rounded-lg shadow-sm">
                    + 新增客戶
                </button>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <table class="w-full text-sm text-left text-slate-600">
                    <thead class="text-xs text-slate-700 uppercase bg-slate-100 border-b border-slate-200">
                        <tr>
                            <th class="px-4 py-3">統一編號</th>
                            <th class="px-4 py-3">公司/客戶名稱</th>
                            <th class="px-4 py-3">負責人</th>
                            <th class="px-4 py-3">聯絡電話</th>
                            <th class="px-4 py-3 text-right">操作</th>
                        </tr>
                    </thead>
                    <tbody id="clients-table-body" class="divide-y divide-slate-200">
                        <!-- 動態生成客戶列表 -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- 視圖 4: 管理分析 (Analytics) -->
        <section id="view-analytics" class="space-y-6 hidden">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 人員工時統計 -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-base font-bold text-slate-800 mb-4 border-b pb-2">人員累積耗用工時 (小時)</h3>
                    <div id="analytics-staff-hours" class="space-y-3">
                        <!-- 動態產生 -->
                    </div>
                </div>
                <!-- 專案進度與投入工時 -->
                <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200">
                    <h3 class="text-base font-bold text-slate-800 mb-4 border-b pb-2">專案總進度與投入工時</h3>
                    <div id="analytics-project-progress" class="space-y-3">
                        <!-- 動態產生 -->
                    </div>
                </div>
            </div>
        </section>

    </main>

<!-- JavaScript 模組區塊 -->
    <script>
        // ==========================================
        // 1. STORAGE & API ADAPTER (資料存儲抽象層)
        // ==========================================
        const STORAGE_MODE = { LOCAL: 'local', CLOUD: 'cloud' };
        const STORAGE_KEYS = {
            MODE: 'pf_storage_mode',
            PROJECTS: 'pf_projects',
            CLIENTS: 'pf_clients',
            EVENTS: 'pf_events',
            LOGS: 'pf_step_logs'
        };

        let currentMode = localStorage.getItem(STORAGE_KEYS.MODE) || STORAGE_MODE.LOCAL;

        const LocalAdapter = {
            async get(key) {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : null;
            },
            async set(key, value) {
                localStorage.setItem(key, JSON.stringify(value));
                return true;
            }
        };

        const ApiAdapter = {
            async get(key) {
                const data = localStorage.getItem('cloud_' + key);
                return data ? JSON.parse(data) : null;
            },
            async set(key, value) {
                localStorage.setItem('cloud_' + key, JSON.stringify(value));
                return true;
            }
        };

        const DataService = {
            getMode() { return currentMode; },
            setMode(mode) {
                currentMode = mode;
                localStorage.setItem(STORAGE_KEYS.MODE, mode);
            },
            _getAdapter() { return currentMode === STORAGE_MODE.CLOUD ? ApiAdapter : LocalAdapter; },
            async _wrap(fn) {
                try { return { success: true, data: await fn() }; }
                catch (e) { return { success: false, error: e.message }; }
            },
            async getProjects() {
                return this._wrap(async () => (await this._getAdapter().get(STORAGE_KEYS.PROJECTS)) || [
                    { id: 1, name: '115年7-8月 營業稅', steps: ['提醒繳交憑證', '收到憑證', '缺漏待補', '整理分類鍵入', '自行檢查', '覆核', '上傳申報', '繳稅完成'] },
                    { id: 2, name: '114年度 營所稅結算申報', steps: ['蒐集帳冊資料', '調整調帳項目', '編製報告書', '會計師簽章', '國稅局申報'] }
                ]);
            },
            async saveProjects(data) { return this._wrap(() => this._getAdapter().set(STORAGE_KEYS.PROJECTS, data)); },
            async getClients() {
                return this._wrap(async () => (await this._getAdapter().get(STORAGE_KEYS.CLIENTS)) || [
                    { id: 101, name: '珍珠聯合會計師事務所', taxId: '88615713', owner: '陳崑琳', phone: '0937-025-207' },
                    { id: 102, name: '寶島科技股份有限公司', taxId: '12345678', owner: '陳大明', phone: '02-23456789' },
                    { id: 103, name: '台灣創新生技股份有限公司', taxId: '54321678', owner: '林玉蓮', phone: '03-5712345' }
                ]);
            },
            async saveClients(data) { return this._wrap(() => this._getAdapter().set(STORAGE_KEYS.CLIENTS, data)); },
            async getEvents() {
                return this._wrap(async () => (await this._getAdapter().get(STORAGE_KEYS.EVENTS)) || [
                    { id: 201, projectId: 1, title: '115年7-8月 營業稅申報截止', dueDate: '2026-09-15', remindDays: 7 },
                    { id: 202, projectId: 2, title: '114年度 營所稅結算申報截止', dueDate: '2026-05-31', remindDays: 14 }
                ]);
            },
            async saveEvents(data) { return this._wrap(() => this._getAdapter().set(STORAGE_KEYS.EVENTS, data)); },
            async getStepLogs() {
                return this._wrap(async () => (await this._getAdapter().get(STORAGE_KEYS.LOGS)) || {
                    '1_101_0': { status: 'done', operator: '老闆 (Admin)', elapsed: 300 },
                    '1_101_1': { status: 'done', operator: '老闆 (Admin)', elapsed: 450 },
                    '1_101_2': { status: 'progress', operator: '老闆 (Admin)', elapsed: 120, lastStart: Date.now() },
                    '1_102_0': { status: 'progress', operator: '員工 (Staff)', elapsed: 180, lastStart: Date.now() },
                    '2_101_0': { status: 'done', operator: '員工 (Staff)', elapsed: 1200 }
                });
            },
            async saveStepLogs(data) { return this._wrap(() => this._getAdapter().set(STORAGE_KEYS.LOGS, data)); }
        };

        // ==========================================
        // 2. GLOBAL STATE & INIT (全局狀態與非同步載入)
        // ==========================================
        let currentRole = localStorage.getItem('pf_role') || 'admin';
        let projects = [];
        let clients = [];
        let events = [];
        let stepLogs = {};

        let activeProjectId = null;
        let activeKey = null;
        let timerInterval = null;

        const STATUS_CONFIG = {
            'none': { label: '未開始', bg: 'bg-slate-100 text-slate-600 hover:bg-slate-200' },
            'progress': { label: '進行中', bg: 'bg-amber-100 text-amber-800 font-semibold hover:bg-amber-200 border border-amber-300 animate-pulse' },
            'done': { label: '已完成', bg: 'bg-emerald-100 text-emerald-800 font-semibold hover:bg-emerald-200' },
            'skip': { label: '無此步驟', bg: 'bg-slate-200 text-slate-500 line-through hover:bg-slate-300' }
        };

        window.addEventListener('DOMContentLoaded', async () => {
            updateRoleUI();
            updateModeUI();
            await reloadAllData();
            if (projects.length > 0) {
                renderProjectDropdown();
                loadProjectMatrix(projects[0].id);
            }
        });

        async function reloadAllData() {
            const [pRes, cRes, eRes, lRes] = await Promise.all([
                DataService.getProjects(),
                DataService.getClients(),
                DataService.getEvents(),
                DataService.getStepLogs()
            ]);
            projects = pRes.data || [];
            clients = cRes.data || [];
            events = eRes.data || [];
            stepLogs = lRes.data || {};
        }

        // ==========================================
        // 3. UI CONTROLS & NAVIGATION (頁面切換與權限)
        // ==========================================
        function switchTab(tabName) {
            ['matrix', 'calendar', 'clients', 'analytics'].forEach(t => {
                const view = document.getElementById(`view-${t}`);
                const nav = document.getElementById(`nav-${t}`);
                if (t === tabName) {
                    view.classList.remove('hidden');
                    nav.classList.add('bg-indigo-600', 'text-white');
                    nav.classList.remove('text-indigo-200');
                } else {
                    view.classList.add('hidden');
                    nav.classList.remove('bg-indigo-600', 'text-white');
                    nav.classList.add('text-indigo-200');
                }
            });

            if (tabName === 'calendar') renderCalendar();
            if (tabName === 'clients') renderClientsTable();
            if (tabName === 'analytics') renderAnalytics();
        }

        function changeRole(role) {
            currentRole = role;
            localStorage.setItem('pf_role', role);
            updateRoleUI();
            if (activeProjectId) renderMatrixTable();
        }

        function updateRoleUI() {
            document.getElementById('role-selector').value = currentRole;
            const adminElements = document.querySelectorAll('.admin-only');
            adminElements.forEach(el => {
                if (currentRole === 'admin') el.classList.remove('hidden');
                else el.classList.add('hidden');
            });
        }

        function toggleStorageMode() {
            const newMode = currentMode === STORAGE_MODE.LOCAL ? STORAGE_MODE.CLOUD : STORAGE_MODE.LOCAL;
            DataService.setMode(newMode);
            updateModeUI();
            reloadAllData().then(() => {
                if (activeProjectId) renderMatrixTable();
            });
        }

        function updateModeUI() {
            const textEl = document.getElementById('mode-text');
            const indEl = document.getElementById('mode-indicator');
            if (currentMode === STORAGE_MODE.CLOUD) {
                textEl.textContent = 'CLOUD';
                indEl.className = 'w-2 h-2 rounded-full bg-sky-400';
            } else {
                textEl.textContent = 'LOCAL';
                indEl.className = 'w-2 h-2 rounded-full bg-emerald-400';
            }
        }

        // ==========================================
        // 4. MATRIX VIEW & TIMER LOGIC (矩陣與打卡)
        // ==========================================
        function renderProjectDropdown() {
            const select = document.getElementById('project-select');
            select.innerHTML = projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            if (activeProjectId) select.value = activeProjectId;
        }

        function loadProjectMatrix(projectId) {
            activeProjectId = parseInt(projectId);
            renderMatrixTable();
        }

        function renderMatrixTable() {
            const project = projects.find(p => p.id === activeProjectId);
            if (!project) return;

            const thead = document.getElementById('matrix-head');
            thead.innerHTML = `
                <tr>
                    <th class="px-4 py-3 bg-slate-100 sticky left-0 z-10 w-48 shadow-sm">客戶名稱</th>
                    ${project.steps.map((s, idx) => `<th class="px-3 py-3 text-center min-w-[120px]">${idx + 1}. ${s}</th>`).join('')}
                </tr>
            `;

            const tbody = document.getElementById('matrix-body');
            tbody.innerHTML = clients.map(client => {
                const stepCells = project.steps.map((_, stepIdx) => {
                    const key = `${project.id}_${client.id}_${stepIdx}`;
                    const log = stepLogs[key] || { status: 'none', elapsed: 0 };
                    const cfg = STATUS_CONFIG[log.status] || STATUS_CONFIG['none'];

                    let displayTime = '';
                    if (log.elapsed > 0) {
                        const mins = Math.floor(log.elapsed / 60);
                        displayTime = `<span class="block text-[10px] opacity-75 font-mono">${mins}m</span>`;
                    }

                    return `
                        <td class="px-2 py-3 text-center">
                            <button onclick="openTimerModal('${key}', '${client.name}', '${project.steps[stepIdx]}')" 
                                class="w-full py-1.5 px-2 text-xs rounded-md transition-all shadow-sm ${cfg.bg}">
                                <div>${cfg.label}</div>
                                ${displayTime}
                            </button>
                        </td>
                    `;
                }).join('');

                return `
                    <tr class="hover:bg-slate-50 border-b border-slate-100">
                        <td class="px-4 py-3 font-semibold text-slate-800 bg-white sticky left-0 z-10 shadow-sm">${client.name}</td>
                        ${stepCells}
                    </tr>
                `;
            }).join('');
        }

        function openTimerModal(key, clientName, stepName) {
            activeKey = key;
            const log = stepLogs[key] || { status: 'none', elapsed: 0 };

            document.getElementById('modal-client-name').textContent = `${clientName} - ${stepName}`;
            updateModalUI(log);
            document.getElementById('timer-modal').classList.remove('hidden');

            if (log.status === 'progress') {
                startLocalTimer(log.lastStart || Date.now(), log.elapsed || 0);
            }
        }

        function closeTimerModal() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('timer-modal').classList.add('hidden');
            activeKey = null;
        }

        function startLocalTimer(startTime, baseElapsed) {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const now = Date.now();
                const currentSession = Math.floor((now - startTime) / 1000);
                const totalSeconds = baseElapsed + currentSession;
                document.getElementById('modal-timer-display').textContent = formatSeconds(totalSeconds);
            }, 1000);
        }

        function updateModalUI(log) {
            const display = document.getElementById('modal-timer-display');
            const badge = document.getElementById('modal-status-badge');
            const cfg = STATUS_CONFIG[log.status] || STATUS_CONFIG['none'];

            display.textContent = formatSeconds(log.elapsed || 0);
            badge.textContent = cfg.label;
            badge.className = `mt-2 inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold ${cfg.bg}`;
        }

        async function handleTimerAction(action) {
            if (!activeKey) return;
            const currentLog = stepLogs[activeKey] || { status: 'none', elapsed: 0 };
            const now = Date.now();
            const operatorName = currentRole === 'admin' ? '老闆 (Admin)' : '員工 (Staff)';

            let newLog = { ...currentLog, operator: operatorName };

            if (action === 'start') {
                newLog.status = 'progress';
                newLog.lastStart = now;
            } else if (action === 'done') {
                if (currentLog.status === 'progress' && currentLog.lastStart) {
                    const sessionSeconds = Math.floor((now - currentLog.lastStart) / 1000);
                    newLog.elapsed = (currentLog.elapsed || 0) + sessionSeconds;
                }
                newLog.status = 'done';
                delete newLog.lastStart;
            } else if (action === 'skip') {
                newLog.status = 'skip';
                delete newLog.lastStart;
            }

            stepLogs[activeKey] = newLog;
            await DataService.saveStepLogs(stepLogs);
            closeTimerModal();
            renderMatrixTable();
        }

        function formatSeconds(secs) {
            const h = String(Math.floor(secs / 3600)).padStart(2, '0');
            const m = String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
            const s = String(secs % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // ==========================================
        // 5. CALENDAR & CLIENTS & PROJECTS (日程/客戶/專案 Modal 控制)
        // ==========================================
        function renderCalendar() {
            const container = document.getElementById('calendar-list');
            container.innerHTML = events.map(ev => {
                const proj = projects.find(p => p.id === ev.projectId);
                return `
                    <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-2">
                        <div class="text-xs font-semibold text-indigo-600">${proj ? proj.name : '一般項目'}</div>
                        <h4 class="font-bold text-slate-800 text-base">${ev.title}</h4>
                        <div class="text-sm text-slate-600">截止日期：<span class="font-mono font-medium text-slate-900">${ev.dueDate}</span></div>
                        <div class="text-xs text-amber-600 bg-amber-50 px-2 py-1 rounded inline-block">提醒：${ev.remindDays || 7} 天前</div>
                    </div>
                `;
            }).join('');
        }

        function renderClientsTable() {
            const tbody = document.getElementById('clients-table-body');
            tbody.innerHTML = clients.map(c => `
                <tr class="hover:bg-slate-50">
                    <td class="px-4 py-3 font-mono">${c.taxId}</td>
                    <td class="px-4 py-3 font-semibold text-slate-800">${c.name}</td>
                    <td class="px-4 py-3">${c.owner || '-'}</td>
                    <td class="px-4 py-3 font-mono">${c.phone || '-'}</td>
                    <td class="px-4 py-3 text-right">
                        <button onclick="editClient(${c.id})" class="admin-only text-indigo-600 hover:text-indigo-900 text-xs font-medium">編輯</button>
                    </td>
                </tr>
            `).join('');
            updateRoleUI();
        }

        // 客戶 Modal
        function openClientModal() {
            document.getElementById('client-form').reset();
            document.getElementById('client-id').value = '';
            document.getElementById('client-modal-title').textContent = '新增客戶';
            document.getElementById('client-modal').classList.remove('hidden');
        }

        function editClient(clientId) {
            const c = clients.find(item => item.id === clientId);
            if (!c) return;

            document.getElementById('client-id').value = c.id;
            document.getElementById('client-name').value = c.name;
            document.getElementById('client-taxId').value = c.taxId;
            document.getElementById('client-owner').value = c.owner || '';
            document.getElementById('client-phone').value = c.phone || '';

            document.getElementById('client-modal-title').textContent = '編輯客戶';
            document.getElementById('client-modal').classList.remove('hidden');
        }

        function closeClientModal() {
            document.getElementById('client-modal').classList.add('hidden');
        }

        async function saveClientForm(e) {
            e.preventDefault();
            const idVal = document.getElementById('client-id').value;

            const clientData = {
                id: idVal ? parseInt(idVal) : Date.now(),
                name: document.getElementById('client-name').value,
                taxId: document.getElementById('client-taxId').value,
                owner: document.getElementById('client-owner').value,
                phone: document.getElementById('client-phone').value
            };

            if (idVal) {
                const idx = clients.findIndex(c => c.id === parseInt(idVal));
                if (idx !== -1) clients[idx] = clientData;
            } else {
                clients.push(clientData);
            }

            await DataService.saveClients(clients);
            closeClientModal();
            renderClientsTable();
            if (activeProjectId) renderMatrixTable();
        }

        // 專案 Modal (v2.2.0 新增)
        function openProjectModal() {
            document.getElementById('project-form').reset();
            document.getElementById('project-id').value = '';
            document.getElementById('project-modal').classList.remove('hidden');
        }

        function closeProjectModal() {
            document.getElementById('project-modal').classList.add('hidden');
        }

        async function saveProjectForm(e) {
            e.preventDefault();
            const name = document.getElementById('project-name').value;
            const stepsRaw = document.getElementById('project-steps').value;
            const steps = stepsRaw.split('\n').map(s => s.trim()).filter(s => s.length > 0);

            if (steps.length === 0) {
                alert('請至少輸入一個工作步驟！');
                return;
            }

            const newProject = {
                id: Date.now(),
                name: name,
                steps: steps
            };

            projects.push(newProject);
            await DataService.saveProjects(projects);
            closeProjectModal();

            renderProjectDropdown();
            loadProjectMatrix(newProject.id);
        }

        // 申報日程 Modal (v2.2.0 新增)
        function openEventModal() {
            document.getElementById('event-form').reset();
            const projSelect = document.getElementById('event-project-id');
            projSelect.innerHTML = `<option value="">-- 無關聯專案 (一般事項) --</option>` + 
                projects.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

            document.getElementById('event-modal').classList.remove('hidden');
        }

        function closeEventModal() {
            document.getElementById('event-modal').classList.add('hidden');
        }

        async function saveEventForm(e) {
            e.preventDefault();
            const projIdVal = document.getElementById('event-project-id').value;
            const title = document.getElementById('event-title').value;
            const dueDate = document.getElementById('event-dueDate').value;
            const remindDays = parseInt(document.getElementById('event-remindDays').value) || 7;

            const newEvent = {
                id: Date.now(),
                projectId: projIdVal ? parseInt(projIdVal) : null,
                title: title,
                dueDate: dueDate,
                remindDays: remindDays
            };

            events.push(newEvent);
            await DataService.saveEvents(events);
            closeEventModal();
            renderCalendar();
        }

        // ==========================================
        // 6. ANALYTICS (管理分析)
        // ==========================================
        function renderAnalytics() {
            renderStaffHours();
            renderProjectStats();
        }

        function renderStaffHours() {
            const container = document.getElementById('analytics-staff-hours');
            const opTotal = {};

            Object.values(stepLogs).forEach(log => {
                const op = log.operator || '未指定';
                opTotal[op] = (opTotal[op] || 0) + (log.elapsed || 0);
            });

            container.innerHTML = Object.keys(opTotal).map(op => {
                const hours = (opTotal[op] / 3600).toFixed(1);
                return `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg">
                        <span class="text-sm font-semibold text-slate-700">${op}</span>
                        <span class="text-sm font-mono font-bold text-indigo-600">${hours} 小時</span>
                    </div>
                `;
            }).join('') || '<p class="text-xs text-slate-400">尚無工時數據</p>';
        }

        function renderProjectStats() {
            const container = document.getElementById('analytics-project-progress');

            container.innerHTML = projects.map(p => {
                const totalSteps = clients.length * p.steps.length;
                let doneSteps = 0;
                let totalElapsed = 0;

                clients.forEach(c => {
                    p.steps.forEach((_, sIdx) => {
                        const log = stepLogs[`${p.id}_${c.id}_${sIdx}`];
                        if (log) {
                            totalElapsed += (log.elapsed || 0);
                            if (log.status === 'done' || log.status === 'skip') doneSteps++;
                        }
                    });
                });

                const progressPercent = totalSteps > 0 ? Math.round((doneSteps / totalSteps) * 100) : 0;
                const hoursFormatted = (totalElapsed / 3600).toFixed(1);

                return `
                    <div class="p-3 bg-slate-50 rounded-lg space-y-2">
                        <div class="flex justify-between text-xs font-semibold">
                            <span class="text-slate-800">${p.name}</span>
                            <span class="text-indigo-600">${progressPercent}% (${hoursFormatted} 小時)</span>
                        </div>
                        <div class="w-full bg-slate-200 rounded-full h-2">
                            <div class="bg-indigo-600 h-2 rounded-full" style="width: ${progressPercent}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
