<!DOCTYPE html>
<!--
==========================================================================
PearlFlow - 主幹入口外殼 (Shell - 動態選單配置化版)
@file        index.html
@version     1.2.1
@updated     2026-09-23
==========================================================================
-->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PearlFlow - 珍珠聯合會計師事務所</title>
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global-config.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/menu-config.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; height: 100vh; display: flex; overflow: hidden; background: #F4F6F8; }
        
        .sidebar { width: 240px; background: #fff; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; }
        
        /* 側邊欄 Logo 專屬自適應容器：鎖定高寬與置中，完美相容方形與長條圖 */
        .sidebar-brand { 
            padding: 10px 16px; 
            height: 72px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            border-bottom: 1px solid var(--border-color); 
            overflow: hidden; 
            box-sizing: border-box;
        }
        .sidebar-brand img { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
            display: block; 
        }

        .sidebar-menu { padding: 16px 12px; display: flex; flex-direction: column; gap: 4px; }
        .menu-item { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 8px; color: var(--text-primary); text-decoration: none; font-size: 0.92rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .menu-item:hover { background: var(--primary-light); color: var(--primary-color); }
        .menu-item.active { background: var(--primary-light); color: var(--primary-color); font-weight: 600; border-left: 4px solid var(--primary-color); }

        .sidebar-footer { padding: 16px; border-top: 1px solid var(--border-color); background: #FAFAFA; }
        .role-switcher-label { font-size: 0.75rem; color: #777; margin-bottom: 6px; display: block; }
        .role-select { width: 100%; padding: 6px 8px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.82rem; background: #fff; }

        .main-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .content-iframe { width: 100%; height: 100%; border: none; background: transparent; }

        /* 螢幕最右下角的系統版號標籤 */
        .system-version-tag {
            position: absolute;
            right: 12px;
            bottom: 8px;
            font-size: 0.75rem;
            color: #999;
            background: rgba(255, 255, 255, 0.75);
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 99;
            backdrop-filter: blur(2px);
        }
    </style>
</head>
<body>

    <!-- 左側側邊欄 -->
    <aside class="sidebar">
        <div>
            <!-- Logo 自適應區塊 (完美相容方形與長條圖，消除多餘文字與上下留白) -->
            <div class="sidebar-brand">
                <img src="logo.png" alt="PearlFlow Logo" onerror="this.style.display='none'">
            </div>

            <!-- 動態導覽列容器 -->
            <nav class="sidebar-menu" id="sidebar-menu-nav"></nav>
        </div>

        <!-- 測試用模擬角色切換器 -->
        <div class="sidebar-footer">
            <label class="role-switcher-label">目前模擬身分 (測試用)：</label>
            <select class="role-select" id="demo-role-selector" onchange="changeDemoRole(this.value)">
                <option value="boss">💼 最高管理者 (Boss)</option>
                <option value="pm">💼 研發/專案主管 (PM)</option>
                <option value="hr">💼 人事主管 (HR)</option>
                <option value="staff">👤 一般執行人員 (Staff)</option>
            </select>
        </div>
    </aside>

    <!-- 主頁面載入區 -->
    <main class="main-container">
        <iframe id="main-frame" class="content-iframe" src="page-matrix.html"></iframe>
        <!-- 螢幕最右下角版號呈現 -->
        <div class="system-version-tag">PearlFlow v1.2.1</div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedRole = localStorage.getItem('pf_demo_role') || PearlAuth.getRole() || 'boss';
            PearlAuth.setRole(savedRole);
            document.getElementById('demo-role-selector').value = savedRole;
            
            // 根據目前角色，動態渲染導覽列
            renderDynamicSidebarMenu();
        });

        function switchPage(pageUrl, element) {
            document.querySelectorAll('.menu-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');
            document.getElementById('main-frame').src = pageUrl;
        }

        function changeDemoRole(role) {
            localStorage.setItem('pf_demo_role', role);
            PearlAuth.setRole(role);

            // 1. 重新渲染導覽列選單與 Icon
            renderDynamicSidebarMenu();

            // 2. 重新載入內嵌 iframe 頁面
            const iframe = document.getElementById('main-frame');
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.location.reload();
            }
        }
    </script>
</body>
</html>
