<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PearlFlow 事務所管理工具</title>
    <link rel="stylesheet" href="css/theme.css">
    <!-- 引入 Supabase JS SDK (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global-config.js"></script>
</head>
<body>
    <div id="app-container">
        <!-- 左側選單 -->
        <aside id="sidebar">
            <div class="brand">PearlFlow</div>
            <nav>
                <a href="#" class="nav-item active" data-page="page-dashboard.html"> Dashboard 儀表板</a>
                <a href="#" class="nav-item" data-page="page-matrix.html"> 專案進度矩陣</a>
                <a href="#" class="nav-item" data-page="page-calendar.html"> 事務所行事曆</a>
                <a href="#" class="nav-item" data-page="page-crm.html"> 客戶管理 (CRM)</a>
                <a href="#" class="nav-item" data-page="page-analytics.html"> 管理分析報表</a>
            </nav>
        </aside>

        <!-- 右側主區域 -->
        <div id="main-wrapper">
            <!-- 頂部資訊列 -->
            <header id="header">
                <div class="page-title"><h3 id="current-page-name">Dashboard 儀表板</h3></div>
                <div class="user-info">
                    <span id="user-display-name">載入中...</span>
                    <span id="user-role-badge" style="padding: 2px 8px; background: #eee; border-radius: 4px; font-size: 0.8rem;">Staff</span>
                    <button class="btn-logout" onclick="handleLogout()">登出</button>
                </div>
            </header>

            <!-- 獨立子頁面載入容器 (Iframe) -->
            <iframe id="content-frame" src="page-dashboard.html"></iframe>
        </div>
    </div>

    <script>
        // 切換側邊欄選單與動態載入子網頁
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                
                // 移除所有 active 狀態
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');

                // 取得目標頁面與標題
                const pageUrl = this.getAttribute('data-page');
                const pageTitle = this.innerText.trim();
                
                // 更新 Header 標題與 iframe 源
                document.getElementById('current-page-name').innerText = pageTitle;
                document.getElementById('content-frame').src = pageUrl;
            });
        });

        // 登出處理
        async function handleLogout() {
            if (confirm('確定要登出系統嗎？')) {
                if (supabase) {
                    await supabase.auth.signOut();
                }
                sessionStorage.clear();
                alert('已成功登出');
                window.location.reload();
            }
        }

        // 初始化檢查登入狀態與使用者名稱
        window.addEventListener('DOMContentLoaded', async () => {
            if (supabase) {
                const { data: { session } } = await supabase.auth.getSession();
                if (session) {
                    document.getElementById('user-display-name').innerText = session.user.email || '使用者';
                } else {
                    document.getElementById('user-display-name').innerText = '未登入 (訪客模式)';
                }
            } else {
                document.getElementById('user-display-name').innerText = '未連接 Supabase';
            }
        });
    </script>
</body>
</html>
