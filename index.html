<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>珍珠聯合會計師事務所 - 內部作業管理系統 v2.2.0</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pearl: {
                            50: '#f4f7f6',
                            100: '#e3eae8',
                            200: '#c7d7d3',
                            300: '#a1bdba',
                            400: '#759d9b',
                            500: '#588281',
                            600: '#446968',
                            700: '#395555',
                            800: '#324747',
                            900: '#2d3d3d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-700 min-h-screen flex flex-col font-sans">

    <!-- 頁首導覽列 -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <!-- Logo / Title -->
                <div class="flex items-center gap-3">
                    <div class="bg-pearl-600 text-white p-2 rounded-lg shadow-inner">
                        <i class="fa-solid fa-calculator text-xl"></i>
                    </div>
                    <div class="flex items-center gap-2">
                        <h1 class="text-lg font-bold tracking-tight text-slate-800">珍珠聯合會計師事務所</h1>
                        <span class="text-xs font-semibold text-pearl-600 bg-pearl-100 px-2 py-0.5 rounded-full">v2.2.0</span>
                    </div>
                </div>

                <!-- Navigation Tabs -->
                <nav class="flex space-x-1 bg-slate-100 p-1 rounded-xl border border-slate-200 text-sm font-medium">
                    <button id="nav-matrix" onclick="switchTab('matrix')" class="px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">
                        <i class="fa-solid fa-table-cells mr-1.5"></i>專案矩陣
                    </button>
                    <button id="nav-kanban" onclick="switchTab('kanban')" class="px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">
                        <i class="fa-solid fa-list-check mr-1.5"></i>Task Focus 看板
                    </button>
                    <button id="nav-analytics" onclick="switchTab('analytics')" class="px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">
                        <i class="fa-solid fa-chart-pie mr-1.5"></i>管理分析
                    </button>
                </nav>

                <!-- Role Switcher -->
                <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 p-1.5 rounded-lg text-xs">
                    <span class="text-slate-500 font-medium ml-1">權限切換:</span>
                    <button id="role-admin" onclick="setRole('admin')" class="px-2.5 py-1 rounded font-bold transition">老闆 (Admin)</button>
                    <button id="role-staff" onclick="setRole('staff')" class="px-2.5 py-1 rounded font-bold transition">員工 (Staff)</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- VIEW 1: 專案矩陣 VIEW -->
        <section id="view-matrix" class="space-y-6">
            <!-- 視圖開頭與動作按鈕 -->
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">專案總覽矩陣</h2>
                    <p class="text-xs text-slate-500 mt-1">點擊專案卡片可進入詳細客戶步驟控管進度表</p>
                </div>
                <div id="admin-project-actions" class="hidden">
                    <button onclick="openProjectModal()" class="px-3.5 py-2 bg-pearl-600 hover:bg-pearl-700 text-white rounded-lg text-xs font-bold shadow-sm transition flex items-center gap-1.5">
                        <i class="fa-solid fa-plus"></i> 新增專案
                    </button>
                </div>
            </div>

            <!-- 專案列表 (Grid) -->
            <div id="project-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- JS 動態渲染卡片 -->
            </div>

            <!-- 專案詳細進度表 (選取專案後展開) -->
            <div id="project-detail-panel" class="hidden bg-white border border-slate-200 rounded-xl shadow-sm p-5 space-y-4">
                <div class="flex justify-between items-center border-b border-slate-100 pb-3">
                    <div class="flex items-center gap-3">
                        <h3 id="detail-project-name" class="text-base font-bold text-slate-800"></h3>
                        <span id="detail-project-cycle" class="text-xs bg-slate-100 text-slate-600 px-2 py-0.5 rounded font-medium"></span>
                    </div>
                    <button onclick="closeProjectDetail()" class="text-slate-400 hover:text-slate-600 text-sm p-1">
                        <i class="fa-solid fa-xmark"></i> 關閉細節
                    </button>
                </div>

                <!-- Matrix Dynamic Table -->
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr id="matrix-table-head" class="bg-slate-50 text-slate-600 border-b border-slate-200">
                                <!-- JS 動態產出標題 -->
                            </tr>
                        </thead>
                        <tbody id="matrix-table-body" class="divide-y divide-slate-100">
                            <!-- JS 動態產出內容 -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- VIEW 2: TASK FOCUS 看板 VIEW -->
        <section id="view-kanban" class="hidden space-y-4">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold text-slate-800">Task Focus 聚焦看板</h2>
                    <p class="text-xs text-slate-500 mt-1">呈現跨專案需處置之客戶與時程警告資訊</p>
                </div>
            </div>
            <div id="kanban-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- JS 動態產出看板資料卡片 -->
            </div>
        </section>

        <!-- VIEW 3: 管理分析 VIEW -->
        <section id="view-analytics" class="hidden space-y-6">
            <div>
                <h2 class="text-xl font-bold text-slate-800">管理分析儀表板</h2>
                <p class="text-xs text-slate-500 mt-1">即時檢視團隊工時統計、每日工時標籤與專案整體完成率</p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- 人員工時統計 (含 7 小時標籤) -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2">
                        <i class="fa-solid fa-clock text-pearl-600 mr-1.5"></i>人員每日工時檢析
                    </h3>
                    <div id="analytics-staff-list" class="space-y-3">
                        <!-- JS 動態生成 -->
                    </div>
                </div>

                <!-- 專案累積工時與進度統計 -->
                <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="text-sm font-bold text-slate-800 border-b border-slate-100 pb-2">
                        <i class="fa-solid fa-chart-column text-pearl-600 mr-1.5"></i>專案累積耗時與進度
                    </h3>
                    <div id="analytics-project-list" class="space-y-3">
                        <!-- JS 動態生成 -->
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- MODAL 1: 計時器與紀錄彈窗 (Timer Modal) -->
    <div id="timer-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 max-w-sm w-full p-5 space-y-4">
            <div class="flex justify-between items-start">
                <div>
                    <span id="modal-client-name" class="text-xs font-bold text-pearl-600 bg-pearl-50 px-2 py-0.5 rounded border border-pearl-100">客戶名稱</span>
                    <h4 id="modal-step-name" class="text-base font-bold text-slate-800 mt-1">步驟名稱</h4>
                </div>
                <button onclick="closeTimerModal()" class="text-slate-400 hover:text-slate-600">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- 計時數字顯示 -->
            <div class="bg-slate-50 border border-slate-200 rounded-lg p-4 text-center space-y-1">
                <div id="timer-display" class="font-mono text-3xl font-bold text-slate-800">00:00:00</div>
                <div class="flex items-center justify-center gap-2 text-xs text-slate-500">
                    <span id="timer-status-badge" class="font-semibold">未開始</span>
                    <span>•</span>
                    <span id="timer-user-info">無紀錄</span>
                </div>
            </div>

            <!-- 動作操作按鈕區 (含四態切換機制) -->
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button id="btn-start" onclick="handleTimerAction('start')" class="py-2.5 bg-pearl-500 hover:bg-pearl-600 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-play"></i> 開始執行
                </button>
                <button id="btn-resume" onclick="handleTimerAction('resume')" class="py-2.5 bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-right"></i> 繼續執行
                </button>
                <button id="btn-pause" onclick="handleTimerAction('pause')" class="py-2.5 bg-amber-500 hover:bg-amber-600 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-pause"></i> 暫停執行
                </button>
                <button id="btn-complete" onclick="handleTimerAction('complete')" class="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg text-xs font-bold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-check"></i> 完成此步驟
                </button>
                <button id="btn-skip" onclick="handleTimerAction('skip')" class="col-span-2 py-2 text-slate-500 hover:bg-slate-100 rounded-lg text-xs font-medium border border-slate-200">
                    標記為「無此步驟」
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL 2: 新增/編輯專案彈窗 (Admin Only) -->
    <div id="project-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-xl border border-slate-200 max-w-md w-full p-5 space-y-4">
            <div class="flex justify-between items-center border-b border-slate-100 pb-2">
                <h4 class="text-base font-bold text-slate-800">專案規格設定</h4>
                <button onclick="closeProjectModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-bold text-slate-700 mb-1">專案名稱</label>
                    <input id="input-proj-name" type="text" placeholder="例如：113年度營利事業所得稅結算申報" class="w-full border border-slate-200 rounded-lg p-2 focus:ring-2 focus:ring-pearl-500 outline-none">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">週期類型</label>
                    <select id="input-proj-cycle" class="w-full border border-slate-200 rounded-lg p-2 focus:ring-2 focus:ring-pearl-500 outline-none">
                        <option value="none">非固定週期</option>
                        <option value="monthly">每月固定週期</option>
                        <option value="bimonthly">雙月固定週期 (如營業稅)</option>
                        <option value="annual">每年固定週期</option>
                    </select>
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">申報/完成截止日</label>
                    <input id="input-proj-deadline" type="date" class="w-full border border-slate-200 rounded-lg p-2 focus:ring-2 focus:ring-pearl-500 outline-none">
                </div>
                <div>
                    <label class="block font-bold text-slate-700 mb-1">標準作業步驟 (一行一步驟)</label>
                    <textarea id="input-proj-steps" rows="4" placeholder="憑證整理&#10;帳務登錄&#10;試算表產出&#10;客戶確認" class="w-full border border-slate-200 rounded-lg p-2 focus:ring-2 focus:ring-pearl-500 outline-none font-mono"></textarea>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button onclick="closeProjectModal()" class="px-3 py-1.5 text-slate-500 border border-slate-200 rounded-lg text-xs font-semibold">取消</button>
                <button onclick="saveProject()" class="px-4 py-1.5 bg-pearl-600 text-white rounded-lg text-xs font-bold hover:bg-pearl-700">儲存專案</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT: APPLICATION LOGIC -->
    <script>
        // ==========================================
        // 1. DATA SERVICE & PERSISTENCE (localStorage API Mock)
        // ==========================================
        const DataService = {
            async getProjects() {
                const data = localStorage.getItem('pearl_projects');
                return data ? JSON.parse(data) : [
                    {
                        id: 'proj_1',
                        name: '113年01-02月 營業稅申報',
                        cycle: 'bimonthly',
                        deadline: '2026-03-15',
                        steps: ['進銷項憑證收集', '進項扣抵憑證登錄', '銷項開立發票核對', '401申報書產出', '網路申報上傳']
                    },
                    {
                        id: 'proj_2',
                        name: '112年度 營利事業所得稅申報',
                        cycle: 'annual',
                        deadline: '2026-05-31',
                        steps: ['年度帳務結轉', '資產負債盤點', '調節表編製', '所得稅結算申報']
                    }
                ];
            },
            async saveProjects(projects) {
                localStorage.setItem('pearl_projects', JSON.stringify(projects));
            },
            async getClients() {
                const data = localStorage.getItem('pearl_clients');
                return data ? JSON.parse(data) : [
                    { id: 'cli_1', name: '珍珠科技股份有限公司', code: 'A001' },
                    { id: 'cli_2', name: '翡翠文化創意有限公司', code: 'A002' },
                    { id: 'cli_3', name: '琉璃實業股份有限公司', code: 'A003' }
                ];
            },
            async getStepLogs() {
                const data = localStorage.getItem('pearl_step_logs');
                return data ? JSON.parse(data) : {};
            },
            async saveStepLogs(logs) {
                localStorage.setItem('pearl_step_logs', JSON.stringify(logs));
            }
        };

        // ==========================================
        // 2. STATE MANAGEMENT
        // ==========================================
        let currentRole = 'admin'; // 'admin' | 'staff'
        let currentTab = 'matrix';
        let projects = [];
        let clients = [];
        let stepLogs = {}; // Key: `${projectId}_${clientId}_${stepIdx}` -> { status, operator, elapsed, lastStart }
        let activeProjectId = null;
        let activeKey = null;
        let timerInterval = null;

        const STATUS_CONFIG = {
            'none': { label: '未開始', bg: 'bg-slate-100 text-slate-600 hover:bg-slate-200' },
            'progress': { label: '進行中', bg: 'bg-amber-100 text-amber-800 font-semibold hover:bg-amber-200 border border-amber-300 animate-pulse' },
            'paused': { label: '已暫停', bg: 'bg-indigo-100 text-indigo-800 font-semibold hover:bg-indigo-200 border border-indigo-300' },
            'done': { label: '已完成', bg: 'bg-emerald-100 text-emerald-800 font-semibold hover:bg-emerald-200' },
            'skip': { label: '無此步驟', bg: 'bg-slate-200 text-slate-500 line-through hover:bg-slate-300' }
        };

        // ==========================================
        // 3. INITIALIZATION & TAB CONTROLS
        // ==========================================
        window.addEventListener('DOMContentLoaded', async () => {
            projects = await DataService.getProjects();
            clients = await DataService.getClients();
            stepLogs = await DataService.getStepLogs();
            
            setRole('admin');
            switchTab('matrix');
        });

        function setRole(role) {
            currentRole = role;
            const btnAdmin = document.getElementById('role-admin');
            const btnStaff = document.getElementById('role-staff');
            const adminActions = document.getElementById('admin-project-actions');

            if (role === 'admin') {
                btnAdmin.className = "px-2.5 py-1 rounded font-bold transition bg-pearl-600 text-white shadow-sm";
                btnStaff.className = "px-2.5 py-1 rounded font-bold transition text-slate-500 hover:text-slate-800";
                if (adminActions) adminActions.classList.remove('hidden');
            } else {
                btnStaff.className = "px-2.5 py-1 rounded font-bold transition bg-pearl-600 text-white shadow-sm";
                btnAdmin.className = "px-2.5 py-1 rounded font-bold transition text-slate-500 hover:text-slate-800";
                if (adminActions) adminActions.classList.add('hidden');
            }
            renderCurrentTab();
        }

        function switchTab(tab) {
            currentTab = tab;
            ['matrix', 'kanban', 'analytics'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                const view = document.getElementById(`view-${t}`);
                if (t === tab) {
                    btn.className = "px-4 py-1.5 rounded-lg font-bold bg-white text-pearl-600 shadow-sm transition";
                    view.classList.remove('hidden');
                } else {
                    btn.className = "px-4 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 font-medium transition";
                    view.classList.add('hidden');
                }
            });
            renderCurrentTab();
        }

        function renderCurrentTab() {
            if (currentTab === 'matrix') renderMatrixView();
            else if (currentTab === 'kanban') renderKanbanView();
            else if (currentTab === 'analytics') renderAnalytics();
        }

        // ==========================================
        // 4. MATRIX VIEW RENDERERS
        // ==========================================
        function renderMatrixView() {
            const grid = document.getElementById('project-grid');
            grid.innerHTML = projects.map(p => {
                const stats = calculateProjectProgress(p);
                return `
                    <div onclick="openProjectDetail('${p.id}')" class="bg-white p-5 rounded-xl border border-slate-200 hover:border-pearl-400 hover:shadow-md transition cursor-pointer space-y-3">
                        <div class="flex justify-between items-start">
                            <h3 class="font-bold text-slate-800 text-base line-clamp-1">${p.name}</h3>
                            <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-slate-100 text-slate-600">${p.cycle}</span>
                        </div>
                        <div class="text-xs text-slate-500 flex items-center gap-4">
                            <span><i class="fa-regular fa-calendar mr-1"></i>截止日: ${p.deadline}</span>
                            <span><i class="fa-solid fa-list-check mr-1"></i>${p.steps.length} 個步驟</span>
                        </div>
                        <div class="space-y-1">
                            <div class="flex justify-between text-xs font-bold">
                                <span class="text-slate-500">完成度</span>
                                <span class="text-pearl-600">${stats.rate}%</span>
                            </div>
                            <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                <div class="bg-pearl-500 h-full transition-all duration-300" style="width: ${stats.rate}%"></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            if (activeProjectId) openProjectDetail(activeProjectId);
        }

        function calculateProjectProgress(project) {
            let total = clients.length * project.steps.length;
            if (total === 0) return { rate: 0 };
            let doneCount = 0;
            clients.forEach(c => {
                project.steps.forEach((_, idx) => {
                    const key = `${project.id}_${c.id}_${idx}`;
                    const log = stepLogs[key];
                    if (log && (log.status === 'done' || log.status === 'skip')) {
                        doneCount++;
                    }
                });
            });
            return { rate: Math.round((doneCount / total) * 100) };
        }

        function openProjectDetail(projectId) {
            activeProjectId = projectId;
            const project = projects.find(p => p.id === projectId);
            if (!project) return;

            document.getElementById('detail-project-name').innerText = project.name;
            document.getElementById('detail-project-cycle').innerText = `截止日：${project.deadline}`;

            const thead = document.getElementById('matrix-table-head');
            thead.innerHTML = `
                <th class="p-3 border-b font-bold">客戶名稱</th>
                ${project.steps.map((s, idx) => `<th class="p-3 border-b font-bold text-center">步驟 ${idx + 1}: ${s}</th>`).join('')}
            `;

            const tbody = document.getElementById('matrix-table-body');
            tbody.innerHTML = clients.map(c => {
                return `
                    <tr class="hover:bg-slate-50/80 transition">
                        <td class="p-3 border-b font-bold text-slate-800">${c.name} <span class="text-slate-400 text-[10px] font-normal">(${c.code})</span></td>
                        ${project.steps.map((s, idx) => {
                            const key = `${project.id}_${c.id}_${idx}`;
                            const log = stepLogs[key] || { status: 'none', operator: '', elapsed: 0 };
                            const cfg = STATUS_CONFIG[log.status] || STATUS_CONFIG['none'];
                            return `
                                <td class="p-2 border-b text-center">
                                    <button onclick="openTimerModal('${key}', '${c.name}', '${s}')" class="w-full py-1.5 px-2 rounded text-xs transition flex flex-col items-center justify-center gap-0.5 ${cfg.bg}">
                                        <span>${cfg.label}</span>
                                        ${log.elapsed ? `<span class="text-[10px] opacity-75 font-mono">${formatSeconds(log.elapsed)}</span>` : ''}
                                    </button>
                                </td>
                            `;
                        }).join('')}
                    </tr>
                `;
            }).join('');

            document.getElementById('project-detail-panel').classList.remove('hidden');
        }

        function closeProjectDetail() {
            activeProjectId = null;
            document.getElementById('project-detail-panel').classList.add('hidden');
        }

        // ==========================================
        // 5. TIMER & LOG MODULE (計時器與 DataService 非同步寫入)
        // ==========================================
        function openTimerModal(key, clientName, stepName) {
            activeKey = key;
            const log = stepLogs[key] || { status: 'none', operator: '', elapsed: 0 };

            document.getElementById('modal-client-name').innerText = clientName;
            document.getElementById('modal-step-name').innerText = stepName;
            document.getElementById('timer-status-badge').innerText = STATUS_CONFIG[log.status] ? STATUS_CONFIG[log.status].label : '未開始';
            document.getElementById('timer-user-info').innerText = log.operator ? `執行人員：${log.operator}` : '尚無操作紀錄';

            // 控制按鈕顯示
            document.getElementById('btn-start').style.display = (log.status === 'none') ? 'flex' : 'none';
            document.getElementById('btn-resume').style.display = (log.status === 'paused') ? 'flex' : 'none';
            document.getElementById('btn-pause').style.display = (log.status === 'progress') ? 'flex' : 'none';

            updateTimerDisplay();

            if (timerInterval) clearInterval(timerInterval);
            if (log.status === 'progress') {
                timerInterval = setInterval(() => {
                    log.elapsed = (log.elapsed || 0) + 1;
                    updateTimerDisplay();
                }, 1000);
            }

            document.getElementById('timer-modal').classList.remove('hidden');
        }

        function updateTimerDisplay() {
            const log = stepLogs[activeKey] || { elapsed: 0 };
            document.getElementById('timer-display').innerText = formatSeconds(log.elapsed || 0);
        }

        function closeTimerModal() {
            if (timerInterval) clearInterval(timerInterval);
            document.getElementById('timer-modal').classList.add('hidden');
        }

        async function handleTimerAction(action) {
            if (!activeKey) return;

            const currentUser = (currentRole === 'admin') ? '老闆 (Admin)' : '員工 (Staff)';
            let log = stepLogs[activeKey] || { status: 'none', elapsed: 0 };

            // 嚴格同人防呆驗證（規格書第 4 條）
            if (log.operator && log.operator !== currentUser && (action === 'pause' || action === 'complete' || action === 'resume')) {
                alert(`[防呆警告] 此步驟當前由「${log.operator}」操作中，依規格書規定，同一步驟之開始/暫停/繼續/完成必須由同一人操作！`);
                return;
            }

            if (action === 'start' || action === 'resume') {
                log.status = 'progress';
                log.operator = currentUser;
                log.lastStart = Date.now();
            } else if (action === 'pause') {
                log.status = 'paused';
            } else if (action === 'complete') {
                log.status = 'done';
            } else if (action === 'skip') {
                log.status = 'skip';
            }

            stepLogs[activeKey] = log;
            await DataService.saveStepLogs(stepLogs);

            closeTimerModal();
            const project = projects.find(p => p.id === activeProjectId);
            if (project) openProjectDetail(project.id);
        }

        // ==========================================
        // 6. KANBAN VIEW RENDERER
        // ==========================================
        function renderKanbanView() {
            const container = document.getElementById('kanban-cards-container');
            let items = [];

            projects.forEach(p => {
                clients.forEach(c => {
                    p.steps.forEach((s, idx) => {
                        const key = `${p.id}_${c.id}_${idx}`;
                        const log = stepLogs[key] || { status: 'none' };
                        if (log.status === 'progress' || log.status === 'paused') {
                            items.push({ project: p, client: c, stepName: s, stepIdx: idx, log, key });
                        }
                    });
                });
            });

            if (items.length === 0) {
                container.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-sm">目前無正在進行或暫停中的聚焦任務</div>`;
                return;
            }

            container.innerHTML = items.map(item => `
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-3">
                    <div class="flex justify-between items-start">
                        <span class="text-xs font-bold text-slate-500 bg-slate-100 px-2 py-0.5 rounded">${item.project.name}</span>
                        <span class="text-xs font-bold px-2 py-0.5 rounded ${STATUS_CONFIG[item.log.status].bg}">${STATUS_CONFIG[item.log.status].label}</span>
                    </div>
                    <div>
                        <h4 class="font-bold text-slate-800 text-sm">${item.client.name}</h4>
                        <p class="text-xs text-slate-600 mt-1">步驟 ${item.stepIdx + 1}: ${item.stepName}</p>
                    </div>
                    <div class="flex justify-between items-center text-xs text-slate-400 border-t border-slate-100 pt-2">
                        <span><i class="fa-regular fa-user mr-1"></i>${item.log.operator || '未指定'}</span>
                        <span class="font-mono font-bold text-slate-700">${formatSeconds(item.log.elapsed || 0)}</span>
                    </div>
                </div>
            `).join('');
        }

        // ==========================================
        // 7. ANALYTICS VIEW RENDERER (含 7 小時標籤)
        // ==========================================
        function renderAnalytics() {
            const staffContainer = document.getElementById('analytics-staff-list');
            const projectContainer = document.getElementById('analytics-project-list');

            let userStats = {};

            Object.values(stepLogs).forEach(log => {
                if (log.operator) {
                    if (!userStats[log.operator]) userStats[log.operator] = { seconds: 0, doneCount: 0 };
                    userStats[log.operator].seconds += (log.elapsed || 0);
                    if (log.status === 'done') userStats[log.operator].doneCount++;
                }
            });

            // 7小時 = 25200 秒門檻判定
            const SEVEN_HOURS_SEC = 25200;

            staffContainer.innerHTML = Object.keys(userStats).length ? Object.entries(userStats).map(([user, data]) => {
                const isUnderTime = data.seconds < SEVEN_HOURS_SEC;
                return `
                    <div class="flex justify-between items-center p-3 bg-slate-50 rounded-lg border border-slate-200">
                        <div>
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-slate-800 text-sm">${user}</span>
                                ${isUnderTime ? `<span class="text-[10px] bg-rose-100 text-rose-700 font-bold px-1.5 py-0.5 rounded border border-rose-200"><i class="fa-solid fa-triangle-exclamation mr-1"></i>日工時未滿 7 小時</span>` : `<span class="text-[10px] bg-emerald-100 text-emerald-700 font-bold px-1.5 py-0.5 rounded border border-emerald-200">工時達標</span>`}
                            </div>
                            <span class="text-slate-400 text-[11px] block mt-0.5">已累積完成 ${data.doneCount} 個步驟</span>
                        </div>
                        <span class="font-mono font-bold text-pearl-600 text-base">${formatSeconds(data.seconds)}</span>
                    </div>
                `;
            }).join('') : '<p class="text-slate-400 italic text-xs">尚無工時紀錄</p>';

            projectContainer.innerHTML = projects.map(p => {
                let totalSec = 0;
                clients.forEach(c => {
                    p.steps.forEach((_, idx) => {
                        const key = `${p.id}_${c.id}_${idx}`;
                        const log = stepLogs[key];
                        if (log) totalSec += (log.elapsed || 0);
                    });
                });
                const stats = calculateProjectProgress(p);

                return `
                    <div class="p-3.5 bg-slate-50 rounded-lg border border-slate-200 space-y-2">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-slate-800 text-sm">${p.name}</span>
                            <span class="font-mono font-bold text-pearl-600 text-xs">${formatSeconds(totalSec)}</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                <div class="bg-pearl-500 h-full transition-all duration-300" style="width: ${stats.rate}%"></div>
                            </div>
                            <span class="font-bold text-xs text-slate-700 min-w-[36px] text-right">${stats.rate}%</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==========================================
        // 8. ADMIN ACTIONS & UTILS
        // ==========================================
        function openProjectModal() {
            document.getElementById('project-modal').classList.remove('hidden');
        }

        function closeProjectModal() {
            document.getElementById('project-modal').classList.add('hidden');
        }

        async function saveProject() {
            const name = document.getElementById('input-proj-name').value.trim();
            const cycle = document.getElementById('input-proj-cycle').value;
            const deadline = document.getElementById('input-proj-deadline').value;
            const stepsRaw = document.getElementById('input-proj-steps').value.trim();

            if (!name || !deadline || !stepsRaw) {
                alert('請完整填寫專案名稱、截止日與步驟！');
                return;
            }

            const steps = stepsRaw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
            const newProject = {
                id: `proj_${Date.now()}`,
                name,
                cycle,
                deadline,
                steps
            };

            projects.push(newProject);
            await DataService.saveProjects(projects);
            closeProjectModal();
            renderCurrentTab();
        }

        function formatSeconds(sec) {
            const hrs = Math.floor(sec / 3600);
            const mins = Math.floor((sec % 3600) / 60);
            const secs = sec % 60;
            return [hrs, mins, secs].map(v => String(v).padStart(2, '0')).join(':');
        }
    </script>
</body>
</html>
