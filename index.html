<!DOCTYPE html>
<!--
==========================================================================
PearlFlow - 珍珠聯合會計師事務所 主入口外殼網頁
@file        index.html
@version     1.1.0
@updated     2026-08-18
@description 升級名片幾何幾何視覺底紋與專業 SVG 向量選單圖示
==========================================================================
-->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PearlFlow - 珍珠聯合會計師事務所</title>
    <link rel="stylesheet" href="css/theme.css?v=1.1.0">
    <!-- 引入 Supabase JS SDK (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global-config.js?v=1.0.6"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 側邊導覽欄 - 融入名片質感背景 */
        #sidebar {
            width: 250px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 15px rgba(0,0,0,0.03);
            z-index: 10;
        }

        /* 品牌區 */
        .brand {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            height: 65px;
            box-sizing: border-box;
            background: #FFFFFF;
        }

        .brand img {
            max-width: 100%;
            max-height: 38px;
            object-fit: contain;
        }

        /* 主內容框架區域 */
        #main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: calc(100vw - 250px);
            height: 100vh;
            overflow: hidden;
        }

        #header {
            height: var(--header-height, 60px);
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }

        #header .page-title h3 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--primary-color);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* 滿版無縫 iframe */
        #content-frame {
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
            display: block;
            background: transparent;
        }

        /* 登出按鈕質感 */
        .btn-logout {
            margin-top: 8px;
            width: 100%;
            padding: 8px;
            background: #FFF5F6;
            color: var(--primary-color);
            border: 1px solid #FCD4D9;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .btn-logout:hover {
            background: var(--primary-color);
            color: #FFFFFF;
        }
    </style>
</head>
<body>
    <div id="app-container">
        <!-- 左側導覽選單 -->
        <aside id="sidebar">
            <div class="brand">
                <img src="logo.png" alt="珍珠聯合會計師事務所 Logo">
            </div>
            
            <nav style="flex: 1; padding: 16px 0;">
                <a href="#" class="nav-item active" data-page="page-dashboard.html">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg>
                    <span>Dashboard 儀表板</span>
                </a>
                <a href="#" class="nav-item" data-page="page-matrix.html">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 11h5V5H4v6zm0 7h5v-6H4v6zm6 0h5v-6h-5v6zm6 0h5v-6h-5v6zm-6-7h5V5h-5v6zm6-6v6h5V5h-5z"/></svg>
                    <span>專案進度矩陣</span>
                </a>
                <a href="#" class="nav-item" data-page="page-calendar.html">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/></svg>
                    <span>事務所行事曆</span>
                </a>
                <a href="#" class="nav-item" data-page="page-crm.html">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    <span>客戶管理 (CRM)</span>
                </a>
                <a href="#" class="nav-item" data-page="page-reports.html">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-7h2v7zm4 0h-2V7h2v10zm4 0h-2v-4h2v4z"/></svg>
                    <span>管理分析報表</span>
                </a>
            </nav>

            <div class="user-profile" style="padding: 16px; border-top: 1px solid var(--border-color); margin-top: auto;">
                <div style="font-size: 0.82rem; color: var(--text-muted);">目前登入使用者：</div>
                <span id="user-display-name" style="font-size: 0.88rem; color: var(--text-primary); font-weight: 600; word-break: break-all;">載入中...</span>
                <button class="btn-logout" onclick="handleLogout()">登出系統</button>
            </div>
        </aside>

        <!-- 右側內容區 -->
        <div id="main-wrapper">
            <header id="header">
                <div class="page-title">
                    <h3 id="current-page-name">Dashboard 儀表板</h3>
                </div>
            </header>
            
            <!-- 載入指定網頁檔 -->
            <iframe id="content-frame" src="page-dashboard.html"></iframe>
        </div>
    </div>

    <script>
        // 切換頁面：替換 iframe src 與標題
        document.querySelectorAll('#sidebar nav .nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');

                const pageUrl = this.getAttribute('data-page');
                const pageTitle = this.querySelector('span').innerText.trim();
                
                document.getElementById('current-page-name').innerText = pageTitle;
                document.getElementById('content-frame').src = pageUrl;
            });
        });

        // 登出與身份檢查
        async function handleLogout() {
            if (confirm('確定要登出系統嗎？')) {
                if (window.supabase) await window.supabase.auth.signOut();
                sessionStorage.clear();
                window.location.reload();
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (window.supabase) {
                const { data: { session } } = await window.supabase.auth.getSession();
                document.getElementById('user-display-name').innerText = session ? (session.user.email || '使用者') : '未登入 (訪客模式)';
            }
        });
    </script>
</body>
</html>
