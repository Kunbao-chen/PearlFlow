<!DOCTYPE html>
<!--
==========================================================================
PearlFlow - 主頁面與導航框架
@file        index.html
==========================================================================
-->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PearlFlow</title>
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global-config.js"></script>
    <script src="js/icons.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; display: flex; height: 100vh; overflow: hidden; background: var(--bg-color); }
        
        .sidebar { width: 240px; background: #fff; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; padding: 20px 0; flex-shrink: 0; }
        .logo-area { padding: 0 20px 20px 20px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; }
        .logo-area img { height: 42px; width: auto; object-fit: contain; }

        .nav-menu { list-style: none; padding: 16px 0; margin: 0; flex: 1; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 24px; color: var(--text-primary); text-decoration: none; font-size: 0.95rem; font-weight: 500; cursor: pointer; transition: all 0.2s ease; }
        .nav-item:hover { background: rgba(182, 40, 70, 0.05); color: var(--primary-color); }
        .nav-item.active { background: var(--primary-light); color: var(--primary-color); font-weight: 600; border-right: 4px solid var(--primary-color); }

        .user-area { padding: 16px 20px; border-top: 1px solid var(--border-color); font-size: 0.85rem; color: #666; }
        .btn-logout { width: 100%; margin-top: 10px; padding: 8px; border: 1px solid var(--border-color); background: #fff; border-radius: 6px; cursor: pointer; color: var(--primary-color); font-weight: 600; transition: all 0.2s; }
        .btn-logout:hover { background: var(--primary-light); }

        .main-content { flex: 1; height: 100vh; border: none; background: transparent; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div>
            <!-- 已移除副標題文字，只留 Logo -->
            <div class="logo-area">
                <img src="logo.png" alt="PearlFlow" onerror="this.style.display='none'">
            </div>

            <!-- 補齊全部圖示 -->
            <ul class="nav-menu">
                <li><a class="nav-item active" onclick="switchPage('page-dashboard.html', this)"><span data-pf-icon="dashboard"></span> Dashboard 儀表板</a></li>
                <li><a class="nav-item" onclick="switchPage('page-matrix.html', this)"><span data-pf-icon="grid"></span> 專案進度矩陣</a></li>
                <li><a class="nav-item" onclick="switchPage('page-calendar.html', this)"><span data-pf-icon="calendar"></span> 事務所行事曆</a></li>
                <li><a class="nav-item" onclick="switchPage('page-crm.html', this)"><span data-pf-icon="users"></span> 客戶管理 (CRM)</a></li>
                <li><a class="nav-item" onclick="switchPage('page-reports.html', this)"><span data-pf-icon="chart"></span> 管理分析報表</a></li>
            </ul>
        </div>

        <div class="user-area">
            <div>目前登入使用者：</div>
            <strong id="user-display-name" style="color: var(--text-primary); display: block; margin-top: 2px;">未登入 (訪客模式)</strong>
            <button class="btn-logout" onclick="handleAuthAction()" id="btn-auth">登出系統</button>
        </div>
    </div>

    <iframe class="main-content" id="content-frame" src="page-dashboard.html"></iframe>

    <script>
        function switchPage(pageUrl, targetNavElement = null) {
            const iframe = document.getElementById('content-frame');
            iframe.src = pageUrl;

            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));

            if (targetNavElement) {
                targetNavElement.classList.add('active');
            } else {
                if (pageUrl.includes('page-templates.html')) {
                    const crmNav = document.querySelector('.nav-item[onclick*="page-crm.html"]');
                    if (crmNav) crmNav.classList.add('active');
                } else {
                    const cleanUrl = pageUrl.split('?')[0];
                    const matchNav = document.querySelector(`.nav-item[onclick*="${cleanUrl}"]`);
                    if (matchNav) matchNav.classList.add('active');
                }
            }
        }

        function handleAuthAction() {
            alert('登出功能待整合權限系統');
        }
    </script>
</body>
</html>
