<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PearlFlow - 珍珠聯合會計師事務所</title>
    <link rel="stylesheet" href="css/theme.css?v=1.0.3">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global-config.js?v=1.0.6"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color, #FAF6F5);
        }

        #app-container {
            display: flex;
            width: 100vw;
            height: 100vh;
        }

        /* 側邊導覽欄 */
        #sidebar {
            width: 240px;
            flex-shrink: 0;
            background-color: #FFFFFF;
            border-right: 1px solid var(--border-color, #EAE2E1);
            display: flex;
            flex-direction: column;
        }

        /* 主內容框架區域 */
        #main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: calc(100vw - 240px);
            height: 100vh;
            overflow: hidden;
        }

        #header {
            height: var(--header-height, 60px);
            background-color: #FFFFFF;
            border-bottom: 1px solid var(--border-color, #EAE2E1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            flex-shrink: 0;
        }

        #header .page-title h3 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--primary-color, #4A4A4A);
        }

        /* 滿版無縫 iframe */
        #content-frame {
            width: 100%;
            height: calc(100vh - 60px);
            border: none;
            display: block;
            background-color: var(--bg-color, #FAF6F5);
        }
    </style>
</head>
<body>
    <div id="app-container">
        <aside id="sidebar">
            <div class="brand" style="padding: 20px; border-bottom: 1px solid var(--border-color, #EAE2E1);">
                <span class="main-name" style="font-weight: bold; color: var(--primary-color, #4A4A4A);">珍珠聯合會計師事務所</span>
            </div>
            
            <nav style="flex: 1; padding: 12px 0;">
                <a href="#" class="nav-item active" data-page="page-dashboard.html">📊 Dashboard 儀表板</a>
                <a href="#" class="nav-item" data-page="page-matrix.html">🧩 專案進度矩陣</a>
                <a href="#" class="nav-item" data-page="page-calendar.html">📅 事務所行事曆</a>
            </nav>

            <div class="user-profile" style="padding: 16px; border-top: 1px solid var(--border-color, #EAE2E1); margin-top: auto;">
                <span id="user-display-name" style="font-size: 0.85rem; color: #7A7A7A;">載入中...</span>
                <button onclick="handleLogout()" style="margin-top: 8px; width: 100%; padding: 6px; background: #FFF0F0; color: #D32F2F; border: 1px solid #FFCDD2; border-radius: 4px; cursor: pointer;">登出</button>
            </div>
        </aside>

        <div id="main-wrapper">
            <header id="header">
                <div class="page-title">
                    <h3 id="current-page-name">📊 Dashboard 儀表板</h3>
                </div>
            </header>
            
            <iframe id="content-frame" src="page-dashboard.html"></iframe>
        </div>
    </div>

    <script>
        // 切換頁面：單純替換 iframe src 與標題
        document.querySelectorAll('#sidebar nav .nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelectorAll('.nav-item').forEach(nav => nav.classList.remove('active'));
                this.classList.add('active');

                const pageUrl = this.getAttribute('data-page');
                const pageTitle = this.innerText.trim();
                
                document.getElementById('current-page-name').innerText = pageTitle;
                document.getElementById('content-frame').src = pageUrl;
            });
        });

        // 登出與身份檢查
        async function handleLogout() {
            if (confirm('確定要登出系統嗎？')) {
                if (window.supabase) await window.supabase.auth.signOut();
                sessionStorage.clear();
                window.location.reload();
            }
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (window.supabase) {
                const { data: { session } } = await window.supabase.auth.getSession();
                document.getElementById('user-display-name').innerText = session ? (session.user.email || '使用者') : '未登入 (訪客模式)';
            }
        });
    </script>
</body>
</html>
