<!DOCTYPE html>
<!--
==========================================================================
PearlFlow - 成員與權限管理頁面 (預設值調整版)
@file        page-members.html
==========================================================================
-->
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成員與權限管理</title>
    <link rel="stylesheet" href="css/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/global-config.js"></script>
    <script src="js/auth-guard.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { padding: 24px; font-family: system-ui, -apple-system, sans-serif; background: transparent; margin: 0; }
        
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-primary { background: var(--primary-color); color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #fff; color: var(--text-primary); border: 1px solid var(--border-color); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; display: inline-flex; align-items: center; gap: 6px; }

        .data-table { width: 100%; border-collapse: separate; border-spacing: 0; background: rgba(255, 255, 255, 0.92); border: 1px solid var(--border-color); border-radius: 10px; overflow: hidden; backdrop-filter: blur(8px); box-shadow: var(--shadow-soft); }
        .data-table th, .data-table td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        .data-table th { background: var(--primary-light); color: var(--primary-color); font-weight: 600; font-size: 0.92rem; }

        .status-badge { padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 600; display: inline-block; }
        .status-active { background: #E8F5E9; color: #2E7D32; }
        .status-inactive { background: #FFEBEE; color: #C62828; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.45); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 100; }
        .modal-body { background: #fff; width: 500px; max-width: 95%; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: #444; }
        .form-control { width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 0.9rem; }

        /* 密碼眼睛輸入框容器樣式 */
        .pwd-input-wrapper { position: relative; display: flex; align-items: center; }
        .pwd-input-wrapper .form-control { padding-right: 40px; }
        .pwd-eye-btn { position: absolute; right: 10px; border: none; background: transparent; cursor: pointer; font-size: 1.1rem; opacity: 0.6; user-select: none; transition: opacity 0.2s; padding: 4px; }
        .pwd-eye-btn:hover { opacity: 1; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div style="display: flex; align-items: center; gap: 10px;">
            <span data-pf-icon="user-check" data-size="22" style="color: var(--primary-color);"></span>
            <h2 style="margin: 0; color: var(--primary-color); font-size: 1.25rem;">成員與權限管理</h2>
        </div>
        <div style="display: flex; gap: 10px;">
            <button class="btn-secondary" onclick="loadMembers()">重新整理</button>
            <button class="btn-primary" data-pf-role="boss,hr" onclick="openAddMemberModal()">新增同仁帳號</button>
        </div>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th>姓名</th>
                <th>電子郵件</th>
                <th>職稱 / 角色</th>
                <th>狀態</th>
                <th>操作與權限設定</th>
            </tr>
        </thead>
        <tbody id="members-tbody">
            <tr><td colspan="5" style="text-align: center; color: #888;">成員資料載入中...</td></tr>
        </tbody>
    </table>

    <!-- 新增同仁 Modal -->
    <div class="modal-overlay" id="addMemberModal">
        <div class="modal-body">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h3 style="margin: 0; color: var(--primary-color); font-size: 1.15rem;">新增事務所同仁</h3>
                <span style="cursor: pointer; color: #888; font-weight: bold;" onclick="closeModal('addMemberModal')">✕</span>
            </div>

            <div class="form-group">
                <label>同仁姓名 *</label>
                <input type="text" class="form-control" id="new-member-name" placeholder="New Employee">
            </div>

            <div class="form-group">
                <label>公務 Email *</label>
                <input type="email" class="form-control" id="new-member-email" placeholder="例：ming@pearl.com">
            </div>

            <!-- 預設密碼 000000 + 壓住看明碼眼睛 -->
            <div class="form-group">
                <label>預設密碼 *</label>
                <div class="pwd-input-wrapper">
                    <input type="password" class="form-control" id="new-member-password" value="000000" placeholder="000000">
                    <button type="button" class="pwd-eye-btn" id="pwd-toggle-btn" title="按住可顯示密碼">👁️</button>
                </div>
            </div>

            <div class="form-group">
                <label>角色權限 *</label>
                <select class="form-control" id="new-member-role">
                    <option value="staff" selected>👤 一般執行人員 (Staff)</option>
                    <option value="pm">💼 研發/專案主管 (PM)</option>
                    <option value="hr">💼 人事主管 (HR)</option>
                    <option value="boss">💼 最高管理者 (Boss)</option>
                </select>
            </div>

            <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 24px; border-top: 1px solid var(--border-color); padding-top: 16px;">
                <button class="btn-secondary" onclick="closeModal('addMemberModal')">取消</button>
                <button class="btn-primary" id="btn-save-member" onclick="submitAddMember()">建立帳號</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadMembers();
            setupPasswordEyeToggle();
        });

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        function openAddMemberModal() {
            document.getElementById('new-member-name').value = '';
            document.getElementById('new-member-email').value = '';
            document.getElementById('new-member-password').value = '000000';
            document.getElementById('addMemberModal').style.display = 'flex';
        }

        // 綁定「按住顯示密碼，放開恢復隱藏」的事件 handler
        function setupPasswordEyeToggle() {
            const pwdInput = document.getElementById('new-member-password');
            const eyeBtn = document.getElementById('pwd-toggle-btn');

            if (!pwdInput || !eyeBtn) return;

            const showPassword = (e) => {
                e.preventDefault();
                pwdInput.type = 'text';
            };

            const hidePassword = (e) => {
                e.preventDefault();
                pwdInput.type = 'password';
            };

            eyeBtn.addEventListener('mousedown', showPassword);
            eyeBtn.addEventListener('mouseup', hidePassword);
            eyeBtn.addEventListener('mouseleave', hidePassword);

            eyeBtn.addEventListener('touchstart', showPassword);
            eyeBtn.addEventListener('touchend', hidePassword);
        }

        // 載入成員列表
        async function loadMembers() {
            const tbody = document.getElementById('members-tbody');
            if (!window.supabase) return;

            const { data: members, error } = await window.supabase
                .from('members')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="5" style="color: red;">載入失敗：${error.message}</td></tr>`;
                return;
            }

            if (!members || members.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #888;">目前尚無成員資料，請點擊「新增同仁帳號」</td></tr>`;
                return;
            }

            const canManage = PearlAuth.hasRole(['boss', 'hr']);

            tbody.innerHTML = members.map(m => {
                const isActive = m.is_active !== false;
                const statusBadge = isActive 
                    ? `<span class="status-badge status-active">在職</span>`
                    : `<span class="status-badge status-inactive">已停用/離職</span>`;

                return `
                    <tr>
                        <td style="font-weight: 600;">${m.name}</td>
                        <td style="color: #666;">${m.email || '未設定'}</td>
                        <td>${m.role_name || '一般同仁'}</td>
                        <td>${statusBadge}</td>
                        <td>
                            ${canManage ? `
                                <button class="btn-secondary" style="padding: 4px 8px; font-size: 0.8rem;" onclick="toggleMemberStatus('${m.id}',${isActive})">
                                    ${isActive ? '停用帳號' : '重新啟用'}
                                </button>
                            ` : '<span style="color:#aaa;">僅限檢視</span>'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // 前端新增成員，連動 Supabase Auth + Trigger
        async function submitAddMember() {
            const nameInput = document.getElementById('new-member-name');
            const email = document.getElementById('new-member-email').value.trim();
            const password = document.getElementById('new-member-password').value;
            const role = document.getElementById('new-member-role').value;
            const btn = document.getElementById('btn-save-member');

            // 如果名字空白，預設帶入 New Employee
            const name = nameInput.value.trim() || 'New Employee';

            if (!email || !password) {
                return alert('請填寫公務 Email 與預設密碼');
            }

            btn.disabled = true;
            btn.innerText = '建立中...';

            const { data, error } = await window.supabase.auth.signUp({
                email: email,
                password: password,
                options: {
                    data: {
                        full_name: name,
                        role: role
                    }
                }
            });

            if (error) {
                alert('帳號建立失敗：' + error.message);
                btn.disabled = false;
                btn.innerText = '建立帳號';
                return;
            }

            btn.disabled = false;
            btn.innerText = '建立帳號';
            alert(`同仁 ${name} 帳號建立成功！預設密碼為 ${password}`);
            closeModal('addMemberModal');
            loadMembers();
        }

        // 停用/啟用同仁 (Soft Delete)
        async function toggleMemberStatus(memberId, currentStatus) {
            const nextStatus = !currentStatus;
            const actionText = nextStatus ? '啟用' : '停用';

            if (confirm(`確定要${actionText}此同仁的帳號權限嗎？`)) {
                await window.supabase
                    .from('members')
                    .update({ is_active: nextStatus })
                    .eq('id', memberId);

                loadMembers();
            }
        }
    </script>
</body>
</html>
